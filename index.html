<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cattle Terminal</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; connect-src https://api.github.com https://gist.githubusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cattle"><meta name="theme-color" content="#0a0c0f">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0a0c0f;--card:#12161b;--card2:#181d24;--line:#262d36;--tx:#e8eaed;--mu:#8b95a1;--am:#ffb000;--up:#2fbf71;--dn:#f0605d;--s1:#3987e5;--s2:#d95926}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.num,td.r,.v{font-family:ui-monospace,Menlo,monospace}
header{position:sticky;top:0;z-index:5;background:#07090bf2;border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:8px 14px;flex-wrap:wrap}
.brand{color:var(--am);font-weight:800;letter-spacing:1px}.sp{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 10px 8px}
nav button{white-space:nowrap}nav button.on,.seg button.on{background:var(--am);color:#111;border-color:var(--am);font-weight:700}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--am)}button.p{background:var(--am);color:#111;font-weight:700}
input:focus,select:focus,textarea:focus{outline:2px solid var(--am);outline-offset:0}
main{padding:12px;max-width:1300px;margin:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;grid-column:span 12;min-width:0}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}
@media(max-width:850px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--am)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.t{background:var(--card2);border-radius:10px;padding:10px}.t .l{color:var(--mu);font-size:12px}.t .v{font-size:20px;font-weight:700}.t .s{color:var(--mu);font-size:11px}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}.sm{font-size:12px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase}td.r,th.r{text-align:right}
td input{width:100%;min-width:70px;padding:4px 6px}td select{padding:4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}.f input,.f select{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:10px;border:1px solid var(--line);border-radius:20px;padding:1px 7px;color:var(--mu);white-space:nowrap}.tag.q{color:var(--am);border-color:var(--am)}
.alert{border-left:3px solid var(--am);background:var(--card2);padding:8px 10px;border-radius:6px;margin-bottom:6px}.alert.bad{border-color:var(--dn)}.alert.good{border-color:var(--up)}
.stage{background:linear-gradient(#101923 0 72%,#1d1a12 72% 100%);border-radius:10px;overflow:hidden}.stage svg{width:100%;display:block}
input[type=range]{width:100%;accent-color:var(--am);padding:0}
.bar{height:10px;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.key{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:5px}
textarea{width:100%;min-height:180px}
#tip{position:fixed;pointer-events:none;background:#000e;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;display:none;z-index:9;white-space:pre}
@media(max-width:700px){header{position:static}}
@media print{header,button,input,select,textarea{display:none!important}body,.c,.t{background:#fff!important;color:#000!important}}
.cg,.cg0{border:1px solid var(--line);border-radius:10px;margin-bottom:8px}.cg{padding:0 10px}.cg>summary,.cg0>summary{display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer;list-style:none;padding:10px 0}.cg0{padding:2px 14px;background:var(--card)}.cg>summary::before,.cg0>summary::before{content:'▸';color:var(--am)}.cg[open]>summary::before,.cg0[open]>summary::before{content:'▾'}
.cline{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;align-items:end}.cgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}.cgrid input,.cgrid select{width:100%}
#growsheet table{color:#000}#growsheet th,#growsheet td{border-bottom:1px solid #ccc}
#growsheet{display:none}
@media print{body.printgrow>*:not(#growsheet){display:none!important}body.printgrow #growsheet{display:block!important;background:#fff;color:#000;padding:10px}}
@media(min-width:701px){nav{flex-wrap:wrap}}
.strip{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.steps{display:flex;gap:4px;flex-wrap:wrap}.steps span{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mu)}.steps span.on{background:var(--am);color:#111;border-color:var(--am);font-weight:700}
.act{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px}.act .n{color:var(--am);font-size:22px;font-weight:800;width:22px;text-align:center}.act .b{flex:1;min-width:0}.act button{white-space:nowrap}
details>summary{cursor:pointer}
@media(max-width:500px){.act{flex-wrap:wrap}.act .b{flex-basis:calc(100% - 40px)}.act button{margin-left:32px}}
</style></head><body>
<header><div class="top"><span class="brand">CATTLE TERMINAL</span><span class="mu sm">Check every price · Revise cada precio</span><span class="sp"></span>
<select id="planSel" aria-label="Plan"></select><span class="sm mu">MXN per USD <input id="fx" type="number" step="0.01" style="width:75px"></span><button id="bkpill" type="button" hidden></button><button id="sypill" type="button">SYNC OFF</button><button id="lang"></button></div><nav id="nav"></nav></header>
<main id="main"></main><div id="tip"></div>
<script>
const $=s=>document.querySelector(s);
const KEY='mmv_cattle_v1';
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const addD=(a,n)=>{const d=new Date(a+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;
const T=(en,es)=>S.lang==='es'?es:en;
/* cost line: [id,en,es,group,basis,amount,status]  basis: head | batch | day (per head per day) | month (per batch) | invest */
const C=(id,en,es,g,b,a,st)=>({id,en,es,g,b,a,st,life:10});
function baseCosts(vet,other){return [
C('vet','Vet, vaccines & deworming','Veterinario, vacunas y desparasitación','health','head',vet,'est'),
C('oth','Labor, transport, tags & fees (lump)','Mano de obra, transporte, aretes y trámites (global)','other','head',other,'est'),
C('flt','Transport to ranch (flete)','Flete al rancho','buy','batch',0,'q'),
C('com','Buying commission','Comisión de compra','buy','head',0,'q'),
C('tag','SINIIGA ear tags / registration','Aretes SINIIGA / registro','legal','head',0,'q'),
C('gui','Movement permits (guía de tránsito)','Guía de tránsito y permisos','legal','batch',0,'q'),
C('tst','Health tests required to move cattle','Pruebas sanitarias para movilizar','legal','head',0,'q'),
C('vit','Vitamins and supplements','Vitaminas y suplementos','health','head',0,'q'),
C('emg','Emergency vet reserve','Reserva para emergencias veterinarias','health','head',0,'q'),
C('sal','Mineral salt (if not in ration)','Sal mineral (si no va en la ración)','feed','day',0,'q'),
C('wat','Water (pipa / delivery / pumping)','Agua (pipa / bombeo)','ops','month',0,'q'),
C('lab','Paid labor','Mano de obra pagada','ops','month',0,'q'),
C('bed','Cleaning, bedding, manure removal','Limpieza, cama y estiércol','ops','month',0,'q'),
C('uti','Electricity, fuel, phone','Luz, gasolina, teléfono','ops','month',0,'q'),
C('sec','Security / insurance','Seguridad / seguro','ops','month',0,'q'),
C('slf','Sale transport, slaughter & selling fees','Flete de venta, rastro y comisiones','sale','head',0,'q'),
C('rem','Money transfer fees','Comisiones por envíos','fin','month',0,'q'),
C('acc','Accounting / taxes (ask accountant)','Contador / impuestos (consultar)','fin','batch',0,'q'),
C('cor','Corral and fence repairs','Corral y cercas','infra','invest',0,'q'),
C('trf','Feed troughs and water troughs','Comederos y bebederos','infra','invest',0,'q'),
C('sha','Shade / roof, dry feed storage','Sombra y bodega de alimento','infra','invest',0,'q'),
C('scl','Scale or weigh tape','Báscula o cinta pesadora','infra','invest',0,'q'),
C('tls','Tools, ropes, wheelbarrow','Herramientas, reatas, carretilla','infra','invest',0,'q')];}
const PH=(en,es,d,adg,feed)=>({en,es,d,adg,feed,useRation:false,ration:[
 {n:'Rastrojo / hay · Rastrojo o heno',kg:0,p:0,cp:0},{n:'Corn · Maíz',kg:0,p:0,cp:8.5},{n:'Sorghum · Sorgo',kg:0,p:0,cp:9},{n:'Soybean meal · Pasta de soya',kg:0,p:0,cp:46},{n:'Molasses · Melaza',kg:0,p:0,cp:4},{n:'Mineral premix · Minerales',kg:0,p:0,cp:0}]});
function oldDefaults(){const A={id:uid(),name:'EXAMPLE (made-up numbers)',head:5,w0:150,price:100,sale:100,yld:55,shrink:2,mort:2,rate:0,target:1000,start:today(),breed:'zebu',costs:baseCosts(500,1000),
phases:[PH('Pasture / growing','Pastoreo / crecimiento',180,0.7,40),PH('Fattening','Engorda',120,1.2,60)]};
return {lang:/^es/i.test(navigator.language||'')?'es':'en',fx:18,plans:[A],plan:A.id,herd:[],ledger:[],stock:[],tasks:[],log:[]};}
function load(){let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}if(raw){try{const x=JSON.parse(raw);if(x&&x.plans){if((x.v||1)<2){try{localStorage.setItem(KEY+'_before_upgrade',raw)}catch(e){}}return upgrade(x)}}catch(e){try{localStorage.setItem(KEY+'_unreadable',raw)}catch(_){}}}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){alert(T('NOT SAVED: browser storage is full or blocked. Download a backup now and remove some photos.','NO SE GUARDÓ: almacenamiento lleno o bloqueado. Descargue un respaldo y borre fotos.'));return false}}
const P=()=>S.plans.find(p=>p.id===S.plan)||S.plans[0];

/* ---------- engine ---------- */
const rationDay=ph=>ph.ration.reduce((s,i)=>s+i.kg*i.p,0);
const feedDay=ph=>ph.useRation?rationDay(ph):ph.feed;
const totalDays=p=>p.phases.reduce((s,f)=>s+f.d,0);
function atDay(p,day){let w=p.w0,feed=0,left=day,idx=0;for(let i=0;i<p.phases.length;i++){const f=p.phases[i],n=Math.max(0,Math.min(left,f.d));if(left>0)idx=i;w+=n*f.adg;feed+=n*feedDay(f);left-=n}return{w,feed,idx}}
const paidPer=p=>(1-p.shrink/100)*(p.basis==='live'?1:p.yld/100);
const unit=p=>p.basis==='live'?T('live kg','kg vivo'):T('carcass kg','kg en canal');
const revenue=(p,w,price=p.sale)=>w*paidPer(p)*price;
/* per-head cost split into groups, accrued to `day` */
function costAt(p,day){const D=totalDays(p)||1,n=Math.max(1,p.head),a=atDay(p,day);const animal=p.w0*p.price;
const g={animal,feed:a.feed,health:0,buy:0,legal:0,ops:0,other:0,sale:0,fin:0,infra:0,risk:animal*p.mort/100};
for(const c of p.costs){let v=0;if(c.b==='head')v=c.a;else if(c.b==='batch')v=c.a/n;else if(c.b==='day')v=c.a*day;else if(c.b==='month')v=c.a*(day/30.4)/n;else v=c.a/Math.max(1,c.life)/n;
 if(c.b==='head'||c.b==='batch'){if(c.g==='sale'){v=day>=D?v:0}else if(c.g==='health'||c.g==='other'||c.id==='acc')v*=Math.min(1,day/D)}g[c.g]+=v}
g.fin+=animal*(p.rate/100)*day/365;g.total=Object.entries(g).reduce((s,[k,v])=>k==='total'?s:s+v,0);return g}
function result(p,o={}){const q=Object.assign({},p,o),D=totalDays(q),a=atDay(q,D),c=costAt(q,D),rev=revenue(q,a.w),profit=rev-c.total;
const per=paidPer(q),kgc=a.w*per;const fixed=c.total-q.w0*q.price,k=q.w0*(1+q.mort/100+q.rate/100*D/365),other=c.total-q.w0*q.price*(1+q.mort/100+q.rate/100*D/365);
return{D,w:a.w,rev,c,profit,roi:c.total?profit/c.total*100:0,bePrice:kgc?c.total/kgc:0,beW:per&&q.sale?c.total/(per*q.sale):0,maxBuy:(rev-other)/k,maxBuyT:(rev-q.target-other)/k,kgc}}

/* ---------- formatting ---------- */
const mx=v=>(v<0?'−':'')+'$'+Math.abs(Math.round(v)).toLocaleString('en-US');
const usd=v=>(v<0?'−':'')+'US$'+Math.abs(Math.round(v/(S.fx||1))).toLocaleString('en-US');
const f1=v=>(Math.round(v*10)/10).toLocaleString('en-US');
const sign=v=>v>=0?'up':'dn';
const tile=(l,v,s='',cls='')=>`<div class="t"><div class="l">${l}</div><div class="v ${cls}">${v}</div><div class="s">${s}</div></div>`;
const GN={animal:['Animal purchase','Compra del animal'],feed:['Feed','Alimento'],health:['Health','Salud'],buy:['Buying & transport','Compra y flete'],legal:['Tags & permits','Aretes y permisos'],ops:['Ranch operations','Operación del rancho'],other:['Labor/transport/fees (lump)','Gastos globales'],sale:['Selling','Venta'],fin:['Financing & transfers','Financiamiento y envíos'],infra:['Equipment (spread out)','Equipo (repartido)'],risk:['Death-loss reserve','Reserva por mortalidad']};
const gn=k=>T(...GN[k]);

/* ---------- the animal ---------- */
const BREEDS={zebu:['Brahman / zebu cross','Cruza cebú / Brahman','#b9b2a6','#8d867b',1],angus:['Black Angus type','Tipo Angus negro','#30333a','#1c1e23',0],char:['Charolais type','Tipo Charolais','#e3d8bd','#bdb094',0],swiss:['Brown Swiss cross','Cruza Suizo','#8a6a4f','#664c37',.15],red:['Red / Hereford type','Tipo rojo / Hereford','#8f4326','#6c2f19',0]};
/* returns svg group; feet at (0,0), faces left. cond: -1 thin .. 0 normal .. +0.5 heavy */
const HEAD='M6 -22 C-14 -26 -32 -10 -42 14 L-60 40 C-68 52 -54 64 -42 58 L-18 44 C2 34 22 20 20 -4Z';
function steer(w,o={}){const m=Math.max(0,Math.min(1,(w-100)/350)),cond=Math.max(-1,Math.min(.6,o.cond||0)),s=Math.pow(Math.max(60,w)/450,1/3);
const b=BREEDS[o.breed]||BREEDS.zebu,fat=m+cond*.35;
const L=215+35*m, leg=112-14*m, dep=78+34*m+12*cond, topY=-(leg+dep), x0=-L/2, x1=L/2, belly=-leg+8+14*fat, rump=10+14*fat, brisket=6+14*fat, neck=34+20*m+8*cond, hump=b[4]*(8+26*m), hs=1.16-.16*m;
const body=`M ${x0+18} ${topY+6} C ${x0+35} ${topY-hump*1.5} ${x0+70} ${topY-hump*1.1} ${x0+90} ${topY+7} C ${-10} ${topY+14-6*fat} ${x1-80} ${topY+8-4*fat} ${x1-38} ${topY+2} C ${x1+rump*.6} ${topY-2} ${x1+rump} ${topY+30} ${x1+rump-6} ${topY+52} C ${x1+rump-8} ${-leg-8} ${x1-18} ${-leg+8} ${x1-48} ${-leg+2} C ${x1-85} ${belly+6} ${x0+95} ${belly+14} ${x0+55} ${-leg+8+brisket*.4} C ${x0+18} ${-leg+10+brisket} ${x0-brisket} ${-leg-14} ${x0-2} ${-leg-38} Z`;
const lg=(x,c,back)=>{const wd=13+9*m+3*cond,t=-leg-24;return back?`<path d="M${x-wd} ${t} C${x-wd} ${-leg+12} ${x+10} ${-leg*.62} ${x+7} ${-leg*.4} L${x+2} -8 L${x-3} 0 H${x+15} L${x+14} -10 L${x+17} ${-leg*.42} C${x+31} ${-leg*.7} ${x+wd+14} ${-leg} ${x+wd+6} ${t}Z" fill="${c}"/>`:`<path d="M${x-wd} ${t} C${x-wd+2} ${-leg+10} ${x-6} ${-leg*.7} ${x-5} ${-leg*.4} L${x-5} -8 L${x-10} 0 H${x+9} L${x+7} -10 L${x+8} ${-leg*.42} C${x+10} ${-leg*.7} ${x+wd} ${-leg+4} ${x+wd} ${t}Z" fill="${c}"/>`};
const hoof=x=>`<path d="M${x-10} 0 L${x-6} -9 H${x+8} L${x+10} 0Z" fill="#14110e"/>`;
const hx=x0-30-12*m, hy=topY+10;
const neckP=`M${x0+52} ${topY+4} C${x0+18} ${topY-4} ${hx+24} ${hy-22} ${hx+4} ${hy-18} L${hx-2} ${hy+22} C${hx+20} ${hy+34} ${x0-8} ${hy+30+neck} ${x0+12} ${-leg-6} L${x0+60} ${-leg-20}Z`;
if(o.ghost){const f='#000',gl=(x,back)=>lg(x,f,back)+hoof(x+(back?6:0)),oid='ol'+uid();
return `<filter id="${oid}" x="-15%" y="-25%" width="130%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="1.8" result="d"/><feComposite in="d" in2="SourceAlpha" operator="out" result="ring"/><feFlood flood-color="${o.stroke}"/><feComposite in2="ring" operator="in"/></filter><g filter="url(#${oid})" opacity=".9"><g transform="scale(${s})">${gl(x0+66)}${gl(x1-62,1)}<path d="${neckP}" fill="${f}"/><path d="${body}" fill="${f}"/>${gl(x0+38)}${gl(x1-30,1)}<g transform="translate(${hx} ${hy}) scale(${hs})"><path d="${HEAD}" fill="${f}"/></g></g></g>`}
const ribs=cond<-.25?[0,1,2,3,4].map(i=>`<path d="M${x0+78+i*19} ${topY+30} q14 22 2 ${dep*.45}" stroke="#0006" stroke-width="3" fill="none" opacity="${Math.min(1,-cond*1.4)}"/>`).join('')+`<path d="M${x1-45} ${topY+12} l18 20 l-6 14" stroke="#0007" stroke-width="3" fill="none"/>`:'';
const cid='cl'+uid();let meat='';
if(o.xray){const H=-topY+hump,fillTop=-leg+20-(dep+10)*(o.yld/100);meat=`<clipPath id="${cid}"><path d="${body}"/></clipPath><rect x="${x0-30}" y="${fillTop}" width="${L+70}" height="${H}" fill="#c4473d" opacity=".8" clip-path="url(#${cid})"/><text x="5" y="${topY+dep*.72}" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">${o.label}</text>`}
return `<g transform="scale(${s})"><ellipse cx="0" cy="3" rx="${L*.62}" ry="9" fill="#0007"/>
<path d="M${x1+rump-14} ${topY+12} C${x1+rump+20} ${topY+30} ${x1+rump+4} ${-leg} ${x1+rump+12} ${-leg*.42}" stroke="${b[3]}" stroke-width="${6+2*m}" fill="none" stroke-linecap="round"/><path d="M${x1+rump+12} ${-leg*.5} q12 22 -1 38 q-13 -16 1 -38Z" fill="#221b15"/>
${lg(x0+66,b[3])}${hoof(x0+66)}${lg(x1-62,b[3],1)}${hoof(x1-56)}
<path d="${neckP}" fill="${b[2]}"/><path d="${body}" fill="${b[2]}"/><linearGradient id="${cid}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient><path d="${body}" fill="url(#${cid}s)"/>
${lg(x0+38,b[2])}${hoof(x0+38)}${lg(x1-30,b[2],1)}${hoof(x1-24)}

/* Imported or stored data is untrusted: ids must be plain tokens, numeric fields numeric, photos real data URLs. */
function clean(x,key){if(Array.isArray(x))return x.map(v=>clean(v,key));if(x&&typeof x==='object'){const o={};for(const[k,v]of Object.entries(x)){if(k==='__proto__'||k==='constructor'||k==='prototype'||/[<>"'&]/.test(k))continue;o[k]=clean(v,k)}return o}
if(typeof x==='string'){if(['id','plan','animal','rel','rev','proposed'].includes(key))return x.replace(/[^\w-]/g,'');if(['date','due','start','expires','next','until','vacNext','wd','nx','docDate','levelDate','testDate'].includes(key)||(key==='d'&&typeof x==='string'))return /^\d{4}-\d\d-\d\d$/.test(x)?x:'';if(key==='img')return /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(x)?x:''}
if(NUMKEYS.has(key)&&typeof x!=='object'&&!(key==='feed'&&x==='')){const n=Number(x);return Number.isFinite(n)?n:0}return x}
function upgrade(x){x=clean(x);for(const k of ['herd','ledger','stock','tasks','log','book','quotes','research','risks','resources','scen','offers','decisions'])if(!Array.isArray(x[k]))x[k]=[];
x.biz=Object.assign({capital:0,reserve:0},x.biz||{});x.exp=Object.assign({growth:25,reinvest:70,feedUp:4,priceUp:0,infl:0,withdraw:0,add:0,landCap:0,waterCap:0,laborCap:0,infra:0,famShare:0},x.exp||{});x.checks=x.checks||{};x.checkInfo=x.checkInfo||{};x.buyer=cleanBuyer(x.buyer);
x.plans.forEach(p=>{if(!p.basis)p.basis='carcass';p.phases.forEach(f=>f.ration=f.ration||[])});
x.water=Object.assign({lo:8,hi:15,extraN:0,extraW:0,tank:0,level:0,levelDate:'',truck:0,truckCost:0,truckShare:100,trough:0,testDate:'',testNote:''},x.water||{});x.feedcfg=Object.assign({who:'plan',waste:0,dmLo:2.2,dmHi:3},x.feedcfg||{});x.feedcfg.who=x.feedcfg.who==='herd'?'herd':'plan';
x.herd.forEach(a=>{if(!['active','sold','lost'].includes(a.status))a.status='active';a.weights=a.weights||[];a.notes=a.notes||[];a.photos=a.photos||[];
 /* a missing or impossible arrival date would break date math: use the first weigh-in (or today) and say so */
 const good=d=>/^\d{4}-\d\d-\d\d$/.test(d||'')&&!isNaN(Date.parse(d));if(!good(a.date)){a.date=a.weights.map(w=>w.d).filter(good).sort()[0]||today();a.dateGuessed=true}});
if((x.v||1)<2){ /* carry v1 money records into the new book without inventing cash movements */
 for(const l of x.ledger){const type=l.type==='exp'?'expense':l.type==='inc'?'other_income':'transfer';x.book.push({id:l.id||uid(),d:l.d,type,cat:l.cat||'ops',c:Math.round(l.amt*100),method:'cash',who:l.who||'',note:(l.note||'')+' [from v1]',animal:'',rel:'',rev:''})}}
for(const k of Object.keys(x.exp))x.exp[k]=Number(x.exp[k])||0;x.fx=Number(x.fx)||18;x.lang=x.lang==='es'?'es':'en';x.rpt=['investor','herd','market'].includes(x.rpt)?x.rpt:'';x.v=2;return x}

const BT={contribution:['Capital I put in','Aportación de capital'],expense:['Operating expense','Gasto de operación'],animal_purchase:['Buy cattle','Compra de ganado'],capital:['Infrastructure / equipment','Infraestructura / equipo'],sale:['Sell cattle','Venta de ganado'],death:['Death loss','Baja por muerte'],withdrawal:['Owner withdrawal','Retiro del dueño'],pay:['Pay a debt','Pagar deuda'],receive:['Collect payment','Cobrar'],other_income:['Other income','Otro ingreso'],transfer:['Note: money sent (no book effect)','Nota: envío (sin efecto)']};

const activeBook=(book=S.book)=>{const gone=new Set(book.filter(x=>x.rev).map(x=>x.rev));return book.filter(x=>!x.rev&&!gone.has(x.id))};
function postings(e,book){const c=e.c,pay=e.method==='credit';switch(e.type){
case'contribution':return[['cash',c],['equity',-c]];case'withdrawal':return[['equity',c],['cash',-c]];
case'expense':return[['expense',c],[pay?'ap':'cash',-c]];case'capital':return[['fixed',c],[pay?'ap':'cash',-c]];
case'animal_purchase':return[['livestock',c],[pay?'ap':'cash',-c]];
case'sale':return[[pay?'ar':'cash',c],['revenue',-c],['cogs',e.carry||0],['livestock',-(e.carry||0)]];
case'death':return[['loss',e.carry||0],['livestock',-(e.carry||0)]];
case'other_income':return[['cash',c],['revenue',-c]];
case'pay':return[['ap',c],['cash',-c]];case'receive':return[['cash',c],['ar',-c]];default:return[]}}
function statements(book=S.book){const b={cash:0,ar:0,livestock:0,fixed:0,ap:0,equity:0,revenue:0,cogs:0,loss:0,expense:0},byCat={};
const act=activeBook(book);for(const e of act){for(const[k,v]of postings(e,book))b[k]+=v;if(['expense','capital','animal_purchase'].includes(e.type)){const k=e.type==='animal_purchase'?'animal':e.type==='capital'?'infra':e.cat;byCat[k]=(byCat[k]||0)+e.c}}
const net=-b.revenue-b.cogs-b.loss-b.expense,assets=b.cash+b.ar+b.livestock+b.fixed;
return{cash:b.cash,ar:b.ar,livestock:b.livestock,fixed:b.fixed,ap:-b.ap,equity:-b.equity,revenue:-b.revenue,cogs:b.cogs,loss:b.loss,expense:b.expense,net,assets,balanced:assets===-b.ap-b.equity+net,spent:Object.values(byCat).reduce((s,v)=>s+v,0),byCat}}
const openAmt=(e,act)=>e.c-act.filter(x=>x.rel===e.id&&(x.type==='pay'||x.type==='receive')).reduce((s,x)=>s+x.c,0);
function toCents(s){s=String(s).trim().replace(/[$,\s]/g,'');if(!/^\d+(\.\d{1,2})?$/.test(s))return null;const[w,f='']=s.split('.');const c=Number(w)*100+Number((f+'00').slice(0,2));return c>0&&c<=1e11?c:null}
function cashOK(book){let run=0;const days={};for(const e of activeBook(book))for(const[k,v]of postings(e,book))if(k==='cash')days[e.d]=(days[e.d]||0)+v;
 for(const d of Object.keys(days).sort()){run+=days[d];if(run<0)return d}return null}

function bookPost(e,{allowDup=false}={}){const act=activeBook();
if(!BT[e.type]||e.type==='transfer')return T('Choose a type.','Elija un tipo.');
if(!/^\d{4}-\d\d-\d\d$/.test(e.d)||e.d>today())return T('Use a real date that is not in the future.','Use una fecha válida, no futura.');
if(e.type!=='death'&&(!Number.isInteger(e.c)||e.c<=0))return T('Enter an amount above zero with at most 2 decimals.','Monto mayor a cero, máx. 2 decimales.');
if(['animal_purchase','sale','death'].includes(e.type)){const a=S.herd.find(a=>a.id===e.animal);if(!a)return T('Choose the animal (add it in HERD first).','Elija el animal (agréguelo en HATO).');
 const mine=t=>act.find(x=>x.animal===e.animal&&x.type===t);if(mine('sale')||mine('death'))return T('This animal is already sold or lost.','Este animal ya se vendió o se perdió.');
 const bought=mine('animal_purchase');if(e.type==='animal_purchase'&&bought)return T('A purchase is already recorded for this animal (blocked so it is not counted twice).','Ya hay compra registrada de este animal.');
 if(e.d<a.date||(bought&&e.d<bought.d))return T('Date is before the animal arrived.','Fecha anterior a la compra.');
 if(e.type!=='animal_purchase'){e.carry=bought?bought.c:0;if(e.type==='death')e.c=e.carry}
 if(e.type==='sale'&&a.until&&a.until>e.d&&!e.vetOK)return 'WITHDRAWAL:'+a.until}
if(e.type==='pay'||e.type==='receive'){const o=act.find(x=>x.id===e.rel&&x.method==='credit');if(!o||(o.type==='sale')!==(e.type==='receive'))return T('Choose an open item.','Elija un pendiente.');if(e.c>openAmt(o,act))return T('More than the open balance (possible duplicate payment).','Más que el saldo (posible pago duplicado).');if(e.d<o.d)return T('Date is before the original entry.','Fecha anterior al original.');e.method='cash'}
if(!allowDup&&act.some(x=>x.type===e.type&&x.d===e.d&&x.c===e.c&&x.animal===e.animal&&x.who===e.who&&x.note===e.note&&x.cat===e.cat&&x.rel===e.rel))return 'DUPLICATE';
const bad=cashOK([...S.book,e]);if(bad)return T(`Not enough cash on ${bad}. Record your capital first, or mark it "on credit".`,`Efectivo insuficiente el ${bad}. Registre su capital o márquelo "a crédito".`);
S.book.push(e);syncStatus();return null}
function bookReverse(id){const act=activeBook(),o=act.find(x=>x.id===id);if(!o)return T('Already reversed.','Ya revertido.');
if(act.some(x=>x.rel===id))return T('Reverse the linked payments first.','Revierta primero los pagos.');
if(o.type==='animal_purchase'&&act.some(x=>x.animal===o.animal&&(x.type==='sale'||x.type==='death')))return T('Reverse the sale or death first.','Revierta primero la venta o baja.');
const r={...o,id:uid(),rev:id,note:'REVERSAL · '+o.note};const bad=cashOK([...S.book,r]);if(bad)return T(`Reversing this would make cash negative on ${bad}.`,`Revertir dejaría efectivo negativo el ${bad}.`);S.book.push(r);syncStatus();return null}

/* ---------- cash flow, scenarios, expansion (planning only) ---------- */
function cashFlow(p,capital=S.biz.capital){const D=totalDays(p),n=Math.ceil(D/30.4-0.05),equip=p.costs.filter(c=>c.b==='invest').reduce((s,c)=>s+c.a,0);
/* equipment is paid in full up front; interest/opportunity cost is not a cash payment */
const cashCost=day=>{const q={...p,rate:0,costs:p.costs.filter(c=>c.b!=='invest')},g=costAt(q,day);return p.head?(g.total-g.risk)*p.head+equip:0};
const rows=[];let prev=0;for(let m=0;m<=n;m++){const day=m===n?D:Math.min(D,Math.round(m*30.4)),spent=cashCost(day);const income=m===n?revenue(p,atDay(p,D).w)*p.head*(1-p.mort/100):0;rows.push({m,day,out:spent-prev,income,cash:capital-spent+rows.reduce((s,r)=>s+r.income,0)+income});prev=spent}
const low=Math.min(...rows.slice(0,-1).map(r=>r.cash),capital-prev),end=rows.at(-1).cash;
return{rows,low,end,spend:prev,revenue:rows.at(-1).income,profit:rows.at(-1).income-prev,required:prev+S.biz.reserve,ok:low>=S.biz.reserve-0.005}}
function maxHerd(p,capital){let lo=0,hi=2000;while(lo<hi){const m=Math.ceil((lo+hi)/2);if(cashFlow({...p,head:m},capital).ok)lo=m;else hi=m-1}return lo}
const SCEN={optimistic:['Optimistic','Optimista',1.10,1.05,.95,1],base:['Base','Base',1,1,1,null],conservative:['Conservative','Conservador',.85,.90,1.10,4],adverse:['Adverse','Adverso',.70,.75,1.25,8]};
function stressed(p,k){const[,, g,pr,fd,mt]=SCEN[k];return{...p,sale:p.sale*pr,mort:mt==null?p.mort:(k==='optimistic'?Math.min:Math.max)(p.mort,mt),phases:p.phases.map(f=>({...f,adg:f.adg*g,feed:feedDay(f)*fd,useRation:false}))}}
function expansion(p){const q=S.exp,out=[];let cash=S.biz.capital,want=p.head;let built=p.head;
for(let y=1;y<=5;y++){if(y>1)cash+=q.add;const inf=(1+q.infl/100)**(y-1);
 const yp=h=>({...p,head:h,sale:p.sale*(1+q.priceUp/100)**(y-1),price:p.price*inf,costs:p.costs.filter(c=>y===1||c.b!=='invest').map(c=>({...c,a:c.a*inf})).concat(h>built&&q.infra?[{id:'x',en:'',es:'',g:'infra',b:'invest',a:(h-built)*q.infra,life:1}]:[]),phases:p.phases.map(f=>({...f,feed:feedDay(f)*(1+q.feedUp/100)**(y-1),useRation:false}))});
 let head=want;const limits=[];for(const[l,cap]of [[T('land','terreno'),q.landCap],[T('water','agua'),q.waterCap],[T('labor','trabajo'),q.laborCap]])if(cap&&head>cap){head=cap;limits.push(l)}
 const asked=head;while(head>0&&!cashFlow(yp(head),cash).ok)head--;if(head<asked)limits.push(T('cash','efectivo'));
 const x=yp(head),f=cashFlow(x,cash),bad=cashFlow({...x,sale:x.sale*.85,phases:x.phases.map(z=>({...z,adg:z.adg*.85}))},cash);
 const wd=head?Math.min(Math.max(0,f.end-S.biz.reserve),q.withdraw+Math.max(0,f.profit)*(1-q.reinvest/100)):0;cash=(head?f.end:cash)-wd;built=Math.max(built,head);
 const why=[];if(f.profit<=0)why.push(T('base case makes no profit','no hay ganancia'));if(bad.end<S.biz.reserve)why.push(T('a 15% price + growth shock eats the reserve','una caída de 15% toca la reserva'));if(!(q.landCap&&q.waterCap&&q.laborCap))why.push(T('land, water and labor capacity not all entered','falta capacidad de terreno, agua y trabajo'));if(limits.length)why.push(T('limited by ','limitado por ')+limits.join(', '));
 out.push({y,head,revenue:head?f.revenue:0,spend:head?f.spend:0,profit:head?f.profit:0,wd,cash,required:head?f.required:0,why});
 want=why.length?head:Math.ceil(head*(1+q.growth/100))}return out}

const enc8=new TextEncoder(),MAGIC='MMVCAT1\n';
async function aes(pass,salt){const k=await crypto.subtle.importKey('raw',enc8.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(text,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aes(pass,salt),enc8.encode(text)));const out=new Uint8Array(36+ct.length);out.set(enc8.encode(MAGIC));out.set(salt,8);out.set(iv,24);out.set(ct,36);return out}
async function unseal(u,pass){if(new TextDecoder().decode(u.slice(0,8))!==MAGIC)throw new Error('not a backup');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(24,36)},await aes(pass,u.slice(8,24)),u.slice(36)))}
function restoreText(t){const x=unwrapBackup(JSON.parse(t));if(!x||!Array.isArray(x.plans)||!x.plans.length||!x.plans.every(p=>Array.isArray(p.phases)&&Array.isArray(p.costs))||!['herd','ledger','stock','tasks','log'].every(k=>Array.isArray(x[k])))throw new Error('bad');return upgrade(x)}

 let err=bookPost(entry);if(err&&err.startsWith('WITHDRAWAL:')){if(!confirm(T(`Medicine withdrawal runs until ${err.slice(11)}. Post ONLY if your veterinarian cleared the sale. Continue?`,`Periodo de retiro hasta ${err.slice(11)}. Registre SOLO con autorización del veterinario. ¿Continuar?`)))return;entry.vetOK=true;err=bookPost(entry)}
 if(err==='DUPLICATE'){if(!confirm(T('An identical entry exists. Did this really happen twice?','Ya existe un registro idéntico. ¿Ocurrió dos veces?')))return;err=bookPost(entry,{allowDup:true})}done(err)}
else if(a==='reverse'){if(confirm(T('Reverse this entry? Both stay in the book.','¿Revertir? Ambos quedan en el libro.')))done(bookReverse(id))}
else if(a==='addquote'){if(!(num('qp')>0)||!val('qs')||!val('ql')||!val('qd'))return alert(T('Price, source, place and date are required.','Precio, fuente, lugar y fecha son obligatorios.'));S.quotes.push({id:uid(),item:val('qi'),cat:val('qc'),value:num('qp'),unit:val('qu'),source:val('qs'),loc:val('ql'),d:val('qd'),expires:val('qx'),status:val('qv')});done()}
else if(a==='addresearch'){let title=val('rt'),text=val('rx');const f=$('#rf').files[0];if(f){if(f.size>300000)return alert(T('File is too large (300 KB max).','Archivo muy grande.'));text=(text?text+'\n\n':'')+await f.text();title=title||f.name}if(!title||!text)return alert(T('Add a title and the findings.','Agregue título y texto.'));S.research.push({id:uid(),agent:val('ra'),title,text:text.slice(0,300000),d:today(),status:'pending'});done()}
else if(a==='addrisk'){if(!val('kx'))return;S.risks.push({id:uid(),d:today(),type:+val('kt'),sev:val('ks'),text:val('kx')});done()}
else if(a==='addres'){if(!val('on'))return;S.resources.push({id:uid(),name:val('on'),owner:val('oo'),cap:val('oc'),share:Math.min(100,Math.max(0,num('os'))),rule:val('or')});done()}
else if(a==='delphoto'){if(confirm(T('Delete photo?','¿Borrar foto?'))){S.herd.find(x=>x.id===id).photos.splice(+b.dataset.j,1);done()}}
else if(a==='rpt'){S.rpt=id;done()}else if(a==='print')window.print();
else if(a==='encexport'){const p=val('bp');if(p.length<10)return alert(T('Use 10+ characters.','Use 10+ caracteres.'));const before=S.lastBackup;S.lastBackup=today();dl('cattle-backup-'+today()+'.enc',await seal(JSON.stringify(S),p),'application/octet-stream');done()}});
document.addEventListener('change',async e=>{const el=e.target;
if(el.dataset.photo){const f=el.files[0];if(!f)return;try{const bmp=await createImageBitmap(f),k=Math.min(1,800/Math.max(bmp.width,bmp.height)),cv=document.createElement('canvas');cv.width=bmp.width*k;cv.height=bmp.height*k;cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);const a=S.herd.find(x=>x.id===el.dataset.photo);a.photos.push({d:today(),img:cv.toDataURL('image/jpeg',.7)});if(!save())a.photos.pop();render()}catch(_){alert(T('That image could not be read (try JPG or PNG).','No se pudo leer la imagen.'))}}
if(el.id==='encimp'){const f=el.files[0];if(!f)return;try{const x=restoreText(await unseal(new Uint8Array(await f.arrayBuffer()),val('bp')));if(confirm(T('Replace all current data with this backup?','¿Reemplazar los datos?'))){S=x;done()}}catch(_){alert(T('Wrong passphrase or damaged file. Nothing was changed.','Frase incorrecta o archivo dañado. No se cambió nada.'))}}});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;const i='1234567890'.indexOf(e.key);if(i>=0&&TABS[i]){tab=TABS[i][0];render()}else if(e.key==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
/* ===== v3 home page ===== */
function cleanBuyer(b){b=b&&typeof b==='object'?b:{};const o={who:String(b.who||''),basis:['live','carcass'].includes(b.basis)?b.basis:'',price:Number(b.price)||0,minW:Number(b.minW)||0,yld:Number(b.yld)||0,payment:String(b.payment||''),docDate:/^\d{4}-\d\d-\d\d$/.test(b.docDate)?b.docDate:'',ref:String(b.ref||''),confirmed:false};o.confirmed=b.confirmed===true&&!buyerProblem(o);return o}
/* what is still missing before terms can be marked as recorded; '' when complete */
function buyerProblem(b){if(!b.who.trim())return T('Enter the buyer name.','Capture el nombre del comprador.');if(!b.basis)return T('Choose live or carcass weight.','Elija peso vivo o en canal.');if(!(b.price>0))return T('Enter the price per kg.','Capture el precio por kg.');if(!(b.minW>0))return T('Enter the minimum LIVE weight accepted.','Capture el peso VIVO mínimo aceptado.');if(b.basis==='carcass'&&!(b.yld>=30&&b.yld<=75))return T('Carcass pay needs the yield % from the buyer (30 to 75).','En canal se necesita el rendimiento % del comprador (30 a 75).');if(!b.payment.trim())return T('Enter when and how you get paid.','Capture cuándo y cómo le pagan.');if(!b.docDate||b.docDate>today())return T('Enter the date of the written document (not in the future).','Fecha del documento (no futura).');if(!b.ref.trim())return T('Say where the written copy is kept.','Indique dónde está la copia escrita.');return ''}
const withTerms=(p,b=S.buyer)=>({...p,basis:b.basis,sale:b.price,yld:b.basis==='carcass'?b.yld:p.yld});
const planMatches=p=>{const b=S.buyer;return p.basis===b.basis&&p.sale===b.price&&(b.basis==='live'||p.yld===b.yld)};

const goBtn=(t,label)=>`<button data-act="go" data-id="${t}">${label||T('Open','Abrir')} →</button>`;
const termsBtn=()=>`<button data-act="terms">${T('Enter terms','Capturar')} →</button>`;
const hasData=()=>S.book.length||S.herd.length||S.log.length||S.stock.length||S.tasks.length||S.quotes.length;
const stockLeft=s=>s.use>0?s.kg/s.use-Math.max(0,days(s.date,today())):null;
const newest=a=>a.filter(d=>d&&d<=today()).sort().at(-1)||'';

/* ---- 1. status strip ---- */
function ranchState(){const p=P(),D=totalDays(p),herd=liveHerd(),st=statements();
 const names=[T('Planning','Planeación'),T('Bought','Comprado'),...p.phases.map(f=>T(f.en,f.es)),T('Sale','Venta')];
 const start=herd.map(a=>a.date).filter(Boolean).sort()[0];let step=0,label=T('Not started','Sin iniciar'),left=null,target='';
 if(start&&start<=today()){const day=days(start,today());target=addD(start,D);left=days(today(),target);step=day>=D?names.length-1:day<=7?1:2+atDay(p,day).idx;label=names[step]}
 else if(!herd.length&&S.herd.length){step=-1;label=T('No active animals','Sin animales activos')}
 return{p,D,herd,st,names,step,label,left,target,avg:herd.length?herd.reduce((s,a)=>s+lastW(a).w,0)/herd.length:null}}
function strip(){const x=ranchState(),sc=score(),capital=x.st.equity>0,over=x.st.cash/100-S.biz.reserve,planDate=addD(x.p.start,x.D);
 return card('',`<div class="strip"><div><div class="sm mu">${T('STAGE (by dates and the selected plan)','ETAPA (según fechas y el plan)')}</div><div style="font-size:24px;font-weight:800">${esc(x.label)}</div></div><div class="steps">${x.names.map((n,i)=>`<span class="${i===x.step?'on':''}">${esc(n)}</span>`).join('')}</div><details><summary class="tag q">${T('Records score','Puntaje de registros')} ${sc.total}/100</summary><div class="sm" style="max-width:340px;margin-top:6px">${sc.rules.map(r=>`<div class="${r[2]?'dn':'up'}">${r[2]?'✕':'✓'} ${r[0]} (${r[1]-r[2]}/${r[1]})</div>`).join('')}<div class="mu">${T('Money and record completeness only. Not a veterinary assessment.','Solo dinero y registros. No es diagnóstico.')}</div></div></details></div>
<div class="tiles" style="margin-top:12px">${tile(T('Cash above reserve','Efectivo sobre la reserva'),capital?mx(over):'—',capital?usd(over):T('no capital recorded yet','sin capital registrado'),capital?sign(over):'')}${tile(T('Active animals','Animales activos'),x.herd.length,x.herd.length?'':T('planned','planeados')+': '+x.p.head)}${tile(T('Average weight','Peso promedio'),x.avg==null?'—':f1(x.avg)+' kg',x.avg==null?T('plan buys at','el plan compra a')+' '+x.p.w0+' kg':T('latest recorded; oldest','último registro; más antiguo')+' '+x.herd.map(a=>lastW(a).d).sort()[0])}${x.left==null?tile(T('Planned sale date (estimate)','Venta planeada (estimado)'),planDate,T('if bought on','si compra el')+' '+x.p.start):tile(x.left<0?T('Days past plan sale date','Días después de la fecha'):T('Days to plan sale date','Días para la venta'),Math.abs(x.left),x.target+' · '+T('from first arrival','desde la primera llegada'),x.left<0?'dn':'')}</div>`)}

/* ---- 2. next actions ---- */
function nextActions(){const p=P(),st=statements(),herd=liveHerd(),act=activeBook(),out=[],A=(en,es,why,btn)=>out.push({t:T(en,es),why,btn});
 if(st.equity>0&&st.cash/100<S.biz.reserve)A('Cash is below your protected reserve','El efectivo está bajo la reserva',T('Check BOOKS before spending more.','Revise LIBROS antes de gastar.'),goBtn('ledger'));
 if(!S.buyer.confirmed)A('Get the buyer’s terms in writing, then record them','Consiga las condiciones por escrito y regístrelas',T('Live or carcass weight changes the whole result.','Peso vivo o en canal cambia todo el resultado.'),termsBtn());
 else if(!planMatches(p))A('Update the selected plan to your buyer’s terms','Actualice el plan con las condiciones del comprador',T('The plan uses a different price, basis or yield.','El plan usa otro precio, base o rendimiento.'),termsBtn());
 if(!(st.equity>0))A('Record the capital you have actually deposited','Registre el capital realmente depositado',T('Your target is not counted as money.','La meta no cuenta como dinero.'),goBtn('ledger'));
 const unpaid=herd.filter(a=>!act.some(x=>x.animal===a.id&&x.type==='animal_purchase'));
 if(unpaid.length)A('Record cattle purchases in BOOKS','Registre las compras en LIBROS',`${unpaid.length} ${T('animals have no purchase entry.','animales sin registro de compra.')}`,goBtn('ledger'));
 if(!herd.length){if(missing(p).length)A('Get real quotes for your costs','Cotice sus costos reales',`${missing(p).length} ${T('cost lines are still $0.','costos siguen en $0.')}`,goBtn('costs'));
  if(![4,5,6,7].every(i=>S.checks[i]))A('Finish the before-you-buy checklist','Complete la lista antes de comprar',T('Vet, space and water, papers, written agreement.','Veterinario, espacio y agua, papeles, acuerdo escrito.'),goBtn('decide'))}
 if(!S.quotes.some(q=>q.item===p.basis&&q.status==='verified'&&q.expires>=today()&&q.d<=today()))A('Add a current verified sale quote','Agregue una cotización de venta vigente',T('Match the plan: ','Según el plan: ')+unit(p)+'.',goBtn('market'));
 const stale=herd.filter(a=>days(lastW(a).d,today())>30);
 if(stale.length)A('Get new weights','Consiga pesajes nuevos',stale.map(a=>esc(a.tag)).join(', ')+' · '+T('over 30 days old','más de 30 días'),goBtn('herd'));
 if(herd.length&&!S.stock.length)A('Count the feed on hand','Cuente el alimento en bodega',T('No feed count recorded.','Sin conteo de alimento.'),goBtn('feed'));
 if(herd.length&&missing(p).length)A('Fill in the missing costs','Complete los costos faltantes',`${missing(p).length} ${T('cost lines are still $0.','costos siguen en $0.')}`,goBtn('costs'));
 if(hasData()&&!(S.lastBackup&&days(S.lastBackup,today())<=7))A('Download a backup','Descargue un respaldo',T('None downloaded in the last 7 days.','Ninguno en los últimos 7 días.'),goBtn('report'));
 return out}
function actionsCard(){const a=nextActions();return card(T('Your next 3 actions','Sus próximas 3 acciones'),a.slice(0,3).map((x,i)=>`<div class="act"><span class="n">${i+1}</span><span class="b"><b>${x.t}</b><br><span class="sm mu">${x.why}</span></span>${x.btn}</div>`).join('')||`<div class="alert">${T('No setup actions are open. Check the list beside this and keep records current.','No hay acciones pendientes. Revise la lista y mantenga los registros.')}</div>`,'c6')+''}

/* ---- 3. today and this week ---- */
function weekItems(){const out=[],soon=addD(today(),7),add=(rank,cls,html)=>out.push({rank,cls,html});
 const lg=[...S.log].filter(x=>x.d).sort((a,b)=>a.d.localeCompare(b.d)).at(-1);
 if(lg&&lg.water==='0')add(0,'bad',`<b>${T('Latest ranch log says water was NOT OK','La última bitácora dice que el agua NO estaba bien')}</b> (${lg.d}). ${T('Confirm with the ranch now.','Confirme con el rancho ahora.')} ${goBtn('care')}`);
 for(const s of S.stock){const l=stockLeft(s);if(l!=null&&l<14)add(l<5?0:2,l<5?'bad':'',`${esc(s.n)}: ${T('about','aprox.')} ${Math.max(0,Math.floor(l))} ${T('days of feed left (estimate from last count)','días de alimento (estimado)')} ${goBtn('feed')}`)}
 for(const t of S.tasks.filter(t=>!t.done&&t.due&&t.due<=soon))add(t.due<today()?1:3,t.due<today()?'bad':'',`<label><input type="checkbox" data-act="done" data-id="${t.id}"> ${esc(t.t)}</label> <span class="sm mu">${t.due<today()?T('OVERDUE','ATRASADA')+' · ':''}${t.due}</span>`);
 for(const a of liveHerd()){const l=lastW(a);
  if(a.vacNext&&a.vacNext<=addD(today(),14))add(a.vacNext<today()?1:3,a.vacNext<today()?'bad':'',`${esc(a.tag)}: ${T('vaccine / vet date','vacuna / veterinario')} ${a.vacNext}${a.vacNext<today()?' · '+T('past: confirm with your vet','pasada: confirme con el veterinario'):''} ${goBtn('herd')}`);
  if(a.until&&a.until>=today())add(1,'bad',`${esc(a.tag)}: ${T('medicine withdrawal until','periodo de retiro hasta')} ${a.until}. ${T('Do not sell without your vet’s clearance.','No venda sin autorización del veterinario.')}`);
  if(days(l.d,today())>30)add(4,'',`${esc(a.tag)}: ${T('weighing due','toca pesar')} (${days(l.d,today())} ${T('days since last','días desde el último')}) ${goBtn('herd')}`)}
 const high=S.risks.filter(r=>r.sev==='high');if(high.length)add(2,'bad',`${high.length} ${T('high risks recorded','riesgos altos registrados')}: ${high.slice(0,3).map(r=>esc(r.text)).join('; ')} ${goBtn('ranch')}`);
 return out.sort((a,b)=>a.rank-b.rank)}
function weekCard(){const w=weekItems(),row=x=>`<div class="alert ${x.cls}">${x.html}</div>`;
 return card(T('Today and this week','Hoy y esta semana'),(w.slice(0,6).map(row).join('')||`<div class="alert">${T('Nothing due in your records. This only covers what has been entered.','Nada pendiente en sus registros. Solo incluye lo capturado.')}</div>`)+(w.length>6?`<details><summary class="sm">+${w.length-6} ${T('more','más')}</summary>${w.slice(6).map(row).join('')}</details>`:'')+`<div class="row">${goBtn('care',T('Add a task or log','Agregar tarea o nota'))}</div>`,'c6')}

/* ---- 4. herd ---- */
function herdCards(){const p=P(),herd=liveHerd();
 if(!herd.length){const r=result(p);return card(T('Planned animal on sale day (illustration, not your cattle)','Animal planeado el día de venta (ilustración)'),`<div class="stage" style="max-width:760px;margin:auto">${cowSVG(p,r.D)}</div><div class="row" style="margin-top:8px"><button class="p" data-act="go" data-id="grow">▶ ${T('Watch it grow','Verlo crecer')}</button>${goBtn('herd',T('Add a real animal','Agregar un animal'))}</div>`)}
 return card(T('Your herd','Su hato'),`<div class="grid">${herd.map(a=>{const l=lastW(a),g=adgOf(a),pw=planW(p,a,l.d),dev=a.weights.length&&pw?(l.w-pw)/pw:null,behind=dev!=null&&dev<-.07,photo=(a.photos||[]).at(-1);
  return `<div class="c c4" style="padding:8px;background:var(--card2)"><div class="stage">${cowSVG(Object.assign({},p,{w0:a.w0,breed:a.breed}),Math.max(0,days(a.date,l.d)),{w:l.w,cond:dev==null?0:Math.max(-1,Math.min(.5,dev*6)),tag:a.tag.slice(0,3),ghosts:false})}</div><div class="row" style="justify-content:space-between;margin-top:6px"><b>${esc(a.tag)}</b><span class="tag ${behind?'q':''}">${dev==null?T('not weighed since arrival','sin pesar desde su llegada'):behind?T('BEHIND plan','ATRASADO'):T('on pace','a buen ritmo')}</span></div><div class="sm">${f1(l.w)} kg <span class="mu">(${l.d})</span><br>${T('Gain/day','Ganancia/día')}: ${g==null?'—':g.toFixed(2)+' kg'}${dev==null?'':`<br>${T('Plan on that date','Plan en esa fecha')}: ${Math.round(pw)} kg (${dev>=0?'+':'−'}${f1(Math.abs(dev*100))}%)`}</div>${photo?`<details class="sm"><summary>${T('Latest photo','Última foto')} ${photo.d}</summary><img src="${photo.img}" alt="" style="max-width:100%;border-radius:8px"></details>`:''}</div>`}).join('')}</div><p class="sm mu">${T('Drawings are illustrations based on weight, not photos or a health assessment. “On pace” means no more than 7% under the plan at the last weighing; it does not promise the sale weight.','Los dibujos son ilustraciones según el peso. “A buen ritmo” = no más de 7% bajo el plan; no garantiza el peso de venta.')}</p><div class="row">${goBtn('herd',T('Open herd','Abrir hato'))}</div>`)}

/* ---- 5. profit check ---- */
function profitCard(){const p=P(),b=S.buyer,ok=b.confirmed,q=ok?withTerms(p):p,r=result(q),gap=missing(p).length,short=ok&&r.w<b.minW;
 const row=basis=>{const x=result({...p,basis}),on=p.basis===basis;return [(basis==='live'?T('LIVE kg','kg VIVO'):T('CARCASS kg','kg CANAL')+` (${p.yld}%)`)+(on?' <span class="tag">'+T('selected plan','plan elegido')+'</span>':''),`<span class="${sign(x.profit)}">${mx(x.profit)}</span>`,`<span class="${sign(x.profit)}">${mx(x.profit*p.head)}</span>`]};
 const head=ok?`<span class="tag">${T('TERMS RECORDED by you','CONDICIONES REGISTRADAS')}</span> <span class="sm">${esc(b.who)} · $${b.price}/${unit(q)} · ${b.docDate}</span>`:`<span class="tag q">${T('UNCONFIRMED · sale terms not recorded','SIN CONFIRMAR · sin condiciones')}</span>`;
 const warn=!ok?`<div class="alert bad">${T('Live or carcass weight changes the result. Treat every profit figure here as unconfirmed until the buyer puts the terms in writing.','Peso vivo o en canal cambia el resultado. Todo es provisional hasta tenerlo por escrito.')}</div>`
  :(short?`<div class="alert bad"><b>${T('Planned weight is below the buyer’s minimum','El peso planeado es menor al mínimo del comprador')}:</b> ${Math.round(r.w)} kg &lt; ${b.minW} kg. ${T('The sale figures may not happen.','La venta podría no darse.')}</div>`:'')+(planMatches(p)?'':`<div class="alert">${T('These headline figures use the recorded terms. Your selected plan still differs, so other tabs use the plan’s own price and basis.','Estas cifras usan las condiciones registradas. El plan elegido difiere; las demás pestañas usan el plan.')} <button class="p" data-act="applyterms">${T('Apply to selected plan','Aplicar al plan')}</button></div>`);
 const tiles=`<div class="tiles">${tile(ok?T('Estimated profit / batch','Ganancia estimada / lote'):T('Profit / batch (unconfirmed)','Ganancia / lote (sin confirmar)'),mx(r.profit*q.head),usd(r.profit*q.head)+` · ${q.head} ${T('head','cabezas')}`,ok&&!short?sign(r.profit):r.profit<0?'dn':'')}${tile(T('Cost per batch (estimate)','Costo por lote (estimado)'),mx(r.c.total*q.head),usd(r.c.total*q.head))}${tile(T('Break-even sale price','Precio de equilibrio'),'$'+f1(r.bePrice),'/'+unit(q))}${tile(T('Max buy price, no loss','Compra máx. sin perder'),r.maxBuy>0?'$'+f1(r.maxBuy)+'/kg':T('None','Ninguno'),T('plan input','dato del plan')+`: $${p.price}/kg`)}</div>`;
 const notes=[gap?`${gap} ${T('cost lines are $0, so real profit may be lower (a lump-sum line may cover some).','costos en $0; la ganancia real puede ser menor.')}`:'',!ok?'':r.profit<0?T('Loses money on these inputs.','Pierde con estos datos.'):r.profit<q.target?T('Under your per-head profit target.','Bajo su meta por cabeza.'):T('Meets your per-head target on these estimates.','Cumple su meta con estos estimados.')].filter(Boolean).map(t=>`<div class="alert">${t}</div>`).join('');
 const F=(k,en,es,type='text')=>field(T(en,es),`<input id="b_${k}" type="${type}" ${type==='number'?'step="any" min="0"':''} value="${esc(b[k]||'')}">`);

const gr={who:'batch',target:0,spread:20,pick:null};
const GMAX=1095; /* never forecast further than three years */
/* plan cut or extended to N days; past the planned end the last stage is assumed to continue */
function trimPlan(p,N){const q={...p,phases:[]};let left=Math.max(0,Math.round(N));p.phases.forEach((f,i)=>{const d=i===p.phases.length-1?left:Math.min(left,f.d);q.phases.push({...f,d});left-=d});return q}
const costTo=(p,n)=>{const q=trimPlan(p,n);return costAt(q,totalDays(q)).total};
const phaseAt=(p,day)=>{let t=0;for(const f of p.phases){t+=f.d;if(day<t)return f}return p.phases[p.phases.length-1]};
const wAt=(p,w0,n,k=1)=>{const q=trimPlan({...p,w0},n);return w0+(atDay(q,totalDays(q)).w-w0)*k};
/* days needed to go from weight w (on plan day "from") to target at k times the planned gain; null if never */
function daysTo(p,w,from,target,k=1){if(w>=target)return 0;for(let i=0;i<GMAX;i++){w+=phaseAt(p,from+i).adg*k;if(w>=target-1e-9)return i+1}return null}
/* recorded weights only: purchase weight plus weigh-ins, one per date, none in the future */
function weighPoints(a){const m=new Map();if(a.w0>0&&a.date)m.set(a.date,a.w0);for(const x of a.weights||[])if(x.w>0&&x.d>=a.date&&x.d<=today())m.set(x.d,x.w);return [...m].map(([d,w])=>({d,w})).sort((x,y)=>x.d.localeCompare(y.d))}
function recentRate(pts){if(pts.length<2)return null;const last=pts[pts.length-1];let use=pts.filter(x=>days(x.d,last.d)<=60);
 let i=pts.length-use.length;while(i>0&&(use.length<2||days(use[0].d,last.d)<14))use.unshift(pts[--i]);
 if(use.length<2||days(use[0].d,last.d)<14)return null;
 const xs=use.map(x=>days(use[0].d,x.d)),ys=use.map(x=>x.w),mxs=xs.reduce((a,b)=>a+b)/xs.length,mys=ys.reduce((a,b)=>a+b)/ys.length,den=xs.reduce((s,x)=>s+(x-mxs)**2,0);
 return den?{kgd:xs.reduce((s,x,j)=>s+(x-mxs)*(ys[j]-mys),0)/den,n:use.length,span:days(use[0].d,last.d)}:null}
/* why: '' ok · few · stale · flat · odd · far · reached · overdue */
function forecast(a,target){const pts=weighPoints(a),last=pts[pts.length-1];const out={pts,last,why:'few',date:'',rate:null};if(!last)return out;
 if(last.w>=target){out.why='reached';out.date=last.d;return out}
 if(!(a.weights||[]).some(x=>x.d>a.date&&x.d<=today()))return out;
 if(days(last.d,today())>45){out.why='stale';return out}
 const r=recentRate(pts);if(!r)return out;out.rate=r;
 /* older gains must not hide what happened since the last weigh-in at least 14 days earlier */
 const ref=[...pts].reverse().find(x=>days(x.d,last.d)>=14),latest=ref?(last.w-ref.w)/days(ref.d,last.d):r.kgd,prev=pts[pts.length-2];
 if(r.kgd<0.05||latest<0.05){out.why='flat';return out}if(r.kgd>2||latest>2){out.why='odd';return out}
 if(last.w<prev.w*0.97){out.why='flat';return out} /* a sudden drop of over 3%, even between close weigh-ins */
 const n=Math.ceil((target-last.w)/r.kgd);if(n>GMAX){out.why='far';return out}
 out.date=addD(last.d,n);out.why=out.date<today()?'overdue':'';return out}
const WHY={few:['Needs a weigh-in at least 14 days after an earlier weight.','Falta un pesaje con 14 días o más de diferencia.'],stale:['Last weight is over 45 days old. Weigh again first.','El último peso tiene más de 45 días. Pese otra vez.'],flat:['Not gaining in recent weights, so no date is shown. Recheck the weight, and call your vet if the animal looks unwell or is off feed.','No está subiendo; no se muestra fecha. Revise el peso y llame al veterinario si se ve mal o no come.'],odd:['Recent gain is over 2 kg a day. Check the weights for a mistake.','Ganancia mayor a 2 kg al día. Revise los pesos.'],far:['At this rate it is more than three years away.','A este ritmo faltan más de tres años.'],overdue:['The estimated date has passed. Weigh to confirm.','La fecha estimada ya pasó. Pese para confirmar.']};

const underMin=(p,w)=>{const m=buyerState(p).min;return m&&w<m?`<span class="dn">${T('below buyer minimum','bajo el mínimo del comprador')} ${m} kg${S.buyer.confirmed?'':' ('+T('unconfirmed','sin confirmar')+')'}</span>`:''};

function behindInfo(p,a,target){const q=asPlan(p,a),pts=weighPoints(a),l=pts.at(-1);if(!l||pts.length<2)return null;const n=days(a.date,l.d),pw=wAt(q,a.w0,n),gap=pw-l.w;
 const onPlan=daysTo(q,a.w0,0,target),fromNow=daysTo(q,l.w,n,target),extra=onPlan!=null&&fromNow!=null?Math.max(0,n+fromNow-onPlan):null;
 return{n,pw,gap,pct:pw?gap/pw*100:0,extra,cost:extra!=null?Math.max(0,costTo(q,n+fromNow)-costTo(q,onPlan)):null}}

function trackCard(p,a,target){let body='';

 else if(a){const f=forecast(a,target),l=f.last,b=behindInfo(p,a,target),g=f.rate;
  body=`<div class="tiles">${tile(T('Last weight','Último peso'),l?f1(l.w)+' kg':'—',l?l.d:'')}${tile(T('Recent gain/day','Ganancia reciente/día'),g?g.kgd.toFixed(2)+' kg':'—',g?`${g.n} ${T('weights over','pesos en')} ${g.span} ${T('days','días')}`:'')}${tile(T('vs plan at last weigh-in','vs plan en el último pesaje'),b?(b.gap>0.5?'▼ '+f1(b.gap)+' kg':b.gap<-0.5?'▲ '+f1(-b.gap)+' kg':T('On plan','En plan')):'—',b?T('plan ','plan ')+Math.round(b.pw)+' kg':'',b?(b.pct>3?'dn':'up'):'')}${tile(T('Estimated date for ','Fecha estimada para ')+target+' kg',dateCell(a,target),f.why===''?(g.n<3?T('rough: only 2 weights','aproximado: solo 2 pesos'):T('rough estimate','estimado aproximado')):'')}</div>
  ${WHY[f.why]?`<p class="sm ${f.why==='flat'||f.why==='odd'?'dn':'mu'}">${T(...WHY[f.why])}</p>`:''}
  ${b&&b.pct>3?`<div class="alert bad"><b>${T('Behind plan by','Atrasado')} ${f1(b.gap)} kg</b><br><span class="sm">${b.extra!=null?`${T('If it gains at the planned rate from here, reaching','Si sube al ritmo planeado desde hoy, llegar a')} ${target} kg ${T('takes about','toma unos')} ${b.extra} ${T('days longer and about','días más y unos')} ${mx(b.cost)} ${T('more in plan costs per head (estimate).','más en costos del plan por cabeza (estimado).')} `:''}${T('Weigh again by','Pese otra vez antes del')} ${nextWeigh(a)}. ${T('Ask your vet if it eats less, looks unwell or keeps falling behind. Have a nutritionist or vet approve any ration change.','Consulte al veterinario si come menos, se ve mal o sigue atrasado. Un nutriólogo o veterinario debe aprobar cambios de ración.')}</span></div>`:''}
  <div class="row" style="margin:10px 0"><input type="date" id="wd_${a.id}" value="${today()}" max="${today()}"><input type="number" id="ww_${a.id}" placeholder="kg" style="width:90px"><button data-act="weigh" data-id="${a.id}">+ ${T('Record weigh-in','Registrar pesaje')}</button></div>`}
 else{body=`<div class="scroll"><table><tr><th>${T('Animal','Animal')}</th><th class="r">${T('Last kg','Último kg')}</th><th>${T('Weighed','Fecha')}</th><th class="r">${T('Recent kg/day','kg/día reciente')}</th><th class="r">${T('vs plan','vs plan')}</th><th>${target} kg ${T('est.','est.')}</th></tr>${liveHerd().map(h=>{const f=forecast(h,target),b=behindInfo(p,h,target),l=f.last;return `<tr><td><button data-act="g-who" data-id="${h.id}">${esc(h.tag)}</button></td><td class="r">${l?f1(l.w):'—'}</td><td>${l?l.d:'—'}</td><td class="r ${f.why==='flat'||f.why==='odd'?'dn':''}">${f.rate?f.rate.kgd.toFixed(2)+(f.why==='flat'||f.why==='odd'?' ⚠':''):'—'}</td><td class="r ${b&&b.pct>3?'dn':''}">${b?(b.gap>0?'▼ ':'▲ ')+f1(Math.abs(b.gap))+' kg':'—'}</td><td>${dateCell(h,target)}</td></tr>`}).join('')}</table></div><p class="sm mu">${T('“—” means there is not enough reliable data for a date. Open an animal to see why. In the chart, each animal starts at its own purchase day; the blue plan line uses the plan’s starting weight.','“—” significa que no hay datos suficientes. Abra el animal para ver por qué. Cada animal empieza en su día de compra.')}</p>`}
 return card(T('Real animals: weight vs plan','Animales reales: peso vs plan'),`${gChips()}<p></p>${body}${weightChart(p,a,target)}<div class="sm" id="gpick" style="margin-top:6px">${pickText()}</div>`)}
function controlsCard(p,target){const end=Math.round(wAt(p,p.w0,totalDays(p)));
 return card(T('Sale weight you are testing','Peso de venta que está probando'),`<div class="row"><b style="font-size:22px" id="gtv">${target} kg</b><span class="sm mu">${T('plan ends at','el plan termina en')} ${end} kg</span><span class="sp" style="flex:1"></span><label class="sm">${T('Slow / fast means gain ±','Lento / rápido: ganancia ±')} <select id="gspread">${[10,20,30,40].map(v=>`<option ${v===gr.spread?'selected':''}>${v}</option>`).join('')}</select>%</label>${gr.target?`<button data-act="g-reset">${T('Back to plan','Volver al plan')}</button>`:''}</div>
 <input type="range" id="gtarget" min="${Math.max(150,Math.ceil((p.w0+10)/10)*10)}" max="${Math.max(550,end)}" step="5" value="${target}" aria-label="${T('Target weight in kg','Peso meta en kg')}"><div class="sm mu">${T('This is a what-if. It does not change your saved plan. Past the planned end, it assumes the last feeding stage continues.','Es una prueba; no cambia su plan guardado. Después del plan supone que sigue la última etapa.')}</div>`)}

function scenarioRows(p,target){const k=gr.spread/100,D=totalDays(p);return[[T('Slow','Lento'),1-k],[T('Plan','Plan'),1],[T('Fast','Rápido'),1+k]].map(([name,kk])=>{
 const wD=wAt(p,p.w0,D,kk),rD=revenue(p,wD)-costTo(p,D),n=daysTo(p,p.w0,0,target,kk);return{name,kk,wD,rD,n,date:n==null?'':addD(p.start,n),profit:n==null?null:revenue(p,target)-costTo(p,n)}})}
function scenarioCard(p,target){const rows=scenarioRows(p,target),D=totalDays(p),money=(v,w)=>v==null?'—':underMin(p,w)||`<span class="${sign(v)}">${mx(v)}</span>`;
 return card(T('Slow, planned and fast growth (per head)','Crecimiento lento, planeado y rápido (por cabeza)'),`${badge(p)}<div class="scroll"><table><tr><th></th><th class="r">${T('Weight on plan end','Peso al final del plan')} (${addD(p.start,D)})</th><th class="r">${T('Profit if sold then','Ganancia si vende ese día')}</th><th class="r">${T('Days to','Días a')} ${target} kg</th><th>${T('Date','Fecha')}</th><th class="r">${T('Profit at','Ganancia a')} ${target} kg</th></tr>${rows.map(r=>`<tr><td><b>${r.name}</b></td><td class="r">${Math.round(r.wD)} kg</td><td class="r">${money(r.rD,r.wD)}</td><td class="r">${r.n==null?'—':r.n}</td><td>${r.date||T('not within 3 years','no en 3 años')}</td><td class="r">${money(r.profit,target)}</td></tr>`).join('')}</table></div><div class="sm mu">${T('These are test cases, not predictions or odds. Same sale price in all three; same feed cost per day, so slower gain costs more per kg. Unpriced cost lines count as $0','Son casos de prueba, no pronósticos. Mismo precio; mismo costo diario. Costos sin precio cuentan como $0')} (${missing(p).length}).</div>`,'c8')}
function next30(p,a){let w,day,rate,basis;const q=asPlan(p,a);
 if(a){const f=forecast(a,9999),r=f.rate,l=f.last;if(!l||!r||['few','stale','flat','odd'].includes(f.why))return{why:f.why};w=l.w;day=days(a.date,l.d);rate=r.kgd;basis=T('from last weigh-in ','desde el último pesaje ')+l.d}
 else{day=Math.min(sim.day,GMAX);w=wAt(q,q.w0,day);rate=(wAt(q,q.w0,day+30)-w)/30;basis=T('from plan day ','desde el día ')+day+' ('+T('move the simulator slider below to change it','mueva el control del simulador')+')'}
 const w2=w+30*rate,from=Math.max(1,day),cost=costTo(q,from+30)-costTo(q,from),add=revenue(p,w2)-revenue(p,w);return{w,w2,cost,add,net:add-cost,basis,rate}}

 const m=buyerState(p).min,cross=m&&x.w<m;
 return card(T('Next 30 days (per head)','Próximos 30 días (por cabeza)'),`<div class="tiles">${tile(T('Added cost','Costo extra'),mx(x.cost))}${tile(T('Added sale value','Valor extra'),mx(x.add),`${Math.round(x.w)} → ${Math.round(x.w2)} kg`)}</div><div class="alert ${cross?'':x.net>0?'good':'bad'}" style="margin-top:8px">${cross?`<b>${T('Below the buyer minimum today, so comparing with “sell now” may not apply.','Hoy está bajo el mínimo del comprador; “vender ya” quizá no aplica.')}</b>`:`<b>${x.net>0?T('Keeping it adds about ','Esperar suma aprox. '):T('Keeping it loses about ','Esperar pierde aprox. ')}${mx(Math.abs(x.net))}</b>`}</div>${badge(p)}<div class="sm mu">${x.basis} · ${x.rate.toFixed(2)} kg/${T('day','día')} · ${T('same price on both dates; costs come from the plan','mismo precio; costos del plan')}</div>`,'c4')}

 return card(T('Real photos by date','Fotos reales por fecha'),hs.map(h=>`<div class="row" style="justify-content:space-between"><b>${esc(h.tag)}</b><label class="sm">+ ${T('Photo (dated today)','Foto (fecha de hoy)')} <input type="file" accept="image/*" data-photo="${h.id}"></label></div>${photoRow(h)}`).join('')+`<div class="sm mu">${T('Photos are shown as taken, never stretched to look like growth.','Las fotos no se deforman para simular crecimiento.')}</div>`)}

const hash=s=>{let h=5381;for(const c of s)h=(h*33+c.charCodeAt(0))>>>0;return h.toString(36)};
function milestones(p,a,target){const q=asPlan(p,a),start=q.start,out=[],who=a?a.tag:T('batch','lote'),key=(k,d)=>'gm-'+hash([k,a?a.id:p.id,d].join('|'));
 const add=(kind,d,text,rep=0)=>{if(d)out.push({kind,d,text,rep,id:key(kind,rep?'':d)})};
 const hs=a?[a]:liveHerd(),nw=hs.length?hs.map(nextWeigh).sort()[0]:(start>today()?start:today());
 add('weigh',nw,`${T('Weigh','Pesar')} ${who} ${T('(same scale, same time of day) and take photos','(misma báscula y hora) y tomar fotos')}`,30);
 add('vet',start>today()?start:today(),T('Talk with the vet about a health schedule for','Hablar con el veterinario sobre el plan de salud de')+' '+who);
 let t=0;p.phases.forEach((f,i)=>{if(i){const d=addD(start,t),pr=T(p.phases[i].en,p.phases[i].es);add('feed'+i,addD(d,-14),`${T('Check feed stock and quotes for stage','Revisar alimento y cotizaciones para la etapa')}: ${pr}`);add('stage'+i,d,`${T('Planned start of','Inicio planeado de')}: ${pr} (${who}). ${T('Have the ration approved and change feed gradually','Ración aprobada y cambio gradual')}`)}t+=f.d});
 let sale='',how='';if(a){const f=forecast(a,target);if(f.why===''){sale=f.date;how=T('from recent gain','según ganancia reciente')}}
 if(!sale){const n=daysTo(q,q.w0,0,target);if(n!=null){sale=addD(start,n);how=T('from the plan','según el plan')}}
 if(sale){add('buyer',addD(sale,-30),T('Confirm buyer, written terms and movement permits for','Confirmar comprador, condiciones por escrito y guías para')+' '+who);add('sale',sale,`${T('Estimated date to reach','Fecha estimada para llegar a')} ${target} kg (${who}, ${how}). ${T('Weigh to confirm','Pese para confirmar')}`)}
 return out.sort((x,y)=>x.d.localeCompare(y.d))}
const hasTask=m=>S.tasks.some(t=>t.id===m.id||(t.t===m.text&&(m.rep||t.due===m.d)));
function addMilestones(list){let n=0;for(const m of list){if(m.d<today()||hasTask(m))continue;S.tasks.push({id:m.id,t:m.text,due:m.d,rep:m.rep,done:false});n++}return n}
function timelineCard(p,a,target){const ms=milestones(p,a,target),open=ms.filter(m=>m.d>=today()&&!hasTask(m));
 return card(T('Timeline','Calendario'),`<div class="scroll"><table>${ms.map((m,i)=>{const past=m.d<today();return `<tr class="${past?'mu':''}"><td style="white-space:nowrap">${m.d}${m.rep?' ↻':''}</td><td>${esc(m.text)}</td><td class="r"><span style="white-space:nowrap">${hasTask(m)?'✓ '+T('in tasks','en tareas'):past?T('date passed','ya pasó'):`<button data-act="g-task" data-id="${i}">+ ${T('Task','Tarea')}</button>`}</span></td></tr>`}).join('')}</table></div><div class="row" style="margin-top:8px"><button class="p" data-act="g-all" ${open.length?'':'disabled'}>${T('Add all upcoming to Care & Tasks','Agregar todo a Cuidado y Tareas')}${open.length?' ('+open.length+')':''}</button><button data-act="go" data-id="care">${T('Open tasks','Ver tareas')} →</button></div><div class="sm mu">${T('Dates are planning estimates. Tasks already added do not move if a forecast changes; check them in Care & Tasks.','Las fechas son estimadas. Las tareas ya agregadas no se mueven solas.')}</div>`,'c7')}
/* always in Spanish, and never any money, so it is safe to send to the ranch */
function growMessage(p,a,target){const hs=a?[a]:liveHerd(),L=['*Avance de crecimiento* · '+today()];
