const QUOTE_DAYS=60; /* a quote with no expiry date is flagged for a re-check after this many days */
const CGROUPS=['health','buy','legal','feed','ops','other','sale','fin','infra'];
const CBASIS={head:['per head','por cabeza'],batch:['per batch','por lote'],day:['per head per day','por cabeza al día'],month:['per month (batch)','por mes (lote)'],invest:['one-time equipment','equipo (una vez)']};
const cName=c=>c.custom?c.en:T(c.en,c.es);
/* what one line adds to the cost of one head over the whole cycle */
const lineHead=(p,c,D=totalDays(p))=>costAt({...p,costs:[c],mort:0,rate:0,w0:0,phases:p.phases.map(f=>({...f,feed:0,useRation:false}))},D).total;
function quoteState(c){if(c.st==='na')return c.a?'unpriced':'na';if(!c.a)return 'unpriced';if(c.st!=='ok')return 'est';const q=c.quote;
 if(!q||!q.src||!q.d)return 'noproof';if(q.a!==c.a||q.b!==c.b)return 'changed';
 if(q.expires?q.expires<today():days(q.d,today())>QUOTE_DAYS)return 'old';return 'good'}
const QS={unpriced:['no price · counts as $0','sin precio · cuenta $0','q'],na:['you marked: not needed','marcado: no aplica',''],est:['estimate','estimado','q'],noproof:['marked quoted, no source recorded','marcado cotizado sin fuente','q'],changed:['amount changed since the quote','cambió desde la cotización','q'],old:['quote expired or old: check again','cotización vencida o vieja','q'],good:['quote recorded','cotización registrada','']};
const qTag=c=>{const s=quoteState(c);return `<span class="tag ${QS[s][2]}" style="white-space:normal;${s==='good'?'color:var(--up);border-color:var(--up)':''}">${T(QS[s][0],QS[s][1])}</span>`};
function recordQuote(c,f){if(!(c.a>0))return T('Enter the amount on the line first.','Primero capture el monto.');if(!f.src.trim())return T('Enter who gave the price.','Capture quién dio el precio.');
 if(!/^\d{4}-\d\d-\d\d$/.test(f.d)||f.d>today())return T('Enter the date of the quote (not in the future).','Fecha de la cotización (no futura).');if(f.expires&&f.expires<f.d)return T('“Valid until” is before the quote date.','La vigencia es anterior a la cotización.');
 c.quote={src:f.src.trim(),loc:(f.loc||'').trim(),d:f.d,expires:f.expires||'',ref:(f.ref||'').trim(),a:c.a,b:c.b};c.st='ok';return ''}

/* how much of the plan total rests on what */
function solidity(p){const r=result(p),parts={good:0,weak:0,inputs:0};
 for(const c of p.costs){const v=lineHead(p,c,r.D);if(quoteState(c)==='good')parts.good+=v;else parts.weak+=v}
 parts.inputs=Math.max(0,r.c.total-parts.good-parts.weak); /* animal, feed, interest, death reserve: typed into the plan */
 const by={};for(const c of p.costs){const s=quoteState(c);(by[s]=by[s]||[]).push(c)}return{parts,by,total:r.c.total}}
const LUMP_PARTS=['flt','com','tag','gui','tst','lab','slf'];
function costWarnings(p){const out=[],get=id=>p.costs.find(c=>c.id===id),lump=get('oth');
 if(lump&&lump.a>0){const dup=p.costs.filter(c=>LUMP_PARTS.includes(c.id)&&c.a>0);if(dup.length)out.push(T('Possible double count: the lump-sum line and these are both priced. Lower the lump sum by whatever it already covered: ','Posible doble cuenta: el gasto global y estos tienen precio. Baje el global: ')+dup.map(cName).join(', '))}
 const salt=get('sal');if(salt&&salt.a>0&&p.phases.some(f=>f.useRation&&f.ration.some(i=>i.kg>0&&/mineral|salt|sal\b/i.test(i.n))))out.push(T('Mineral salt is priced on its own and also appears in a ration being used.','La sal mineral está aparte y también en la ración.'));
 const names={};for(const c of p.costs.filter(c=>c.a>0)){const k=cName(c).trim().toLowerCase();names[k]=(names[k]||0)+1}for(const k of Object.keys(names))if(names[k]>1)out.push(T('Two priced lines have the same name: ','Dos renglones con el mismo nombre: ')+k);
 for(const c of p.costs)if(c.st==='na'&&c.a>0)out.push(`${cName(c)}: ${T('marked “not needed” but it has an amount, which IS counted.','marcado “no aplica” pero tiene monto y SÍ se cuenta.')}`);
 for(const c of p.costs)if(c.b==='invest'&&c.a>0&&!(c.life>=1))out.push(`${cName(c)}: ${T('set how many cycles it lasts (counted as 1 for now).','indique cuántos ciclos dura (se cuenta 1).')}`);
 return out}

/* ---------- 1. summary ---------- */
function summaryCard(p){const r=result(p),n=p.head,gain=r.w-p.w0,run=r.c.total-r.c.animal,perKg=gain>0?run/gain:null,valKg=paidPer(p)*p.sale,
 equip=p.costs.filter(c=>c.b==='invest').reduce((s,c)=>s+c.a,0),gap=missing(p).length;
 return card(T('What this batch costs','Lo que cuesta este lote'),`<div class="tiles">${tile(T('Total cost per head','Costo total por cabeza'),mx(r.c.total),usd(r.c.total))}${tile(T('Total cost, batch','Costo total del lote'),mx(r.c.total*n),`${usd(r.c.total*n)} · ${n} ${T('head','cabezas')}`)}${tile(T('Cost of each kg gained','Costo por kg ganado'),perKg==null?'—':'$'+f1(perKg),T('everything except buying the animal','todo menos la compra'),perKg!=null&&perKg>valKg?'dn':'')}${tile(T('Sale value of one more kg','Valor de venta de 1 kg más'),'$'+f1(valKg),`${T('at','a')} $${p.sale}/${unit(p)}`)}${tile(T('Break-even sale price','Precio de equilibrio'),'$'+f1(r.bePrice),'/'+unit(p))}${tile(T('Profit per head (plan)','Ganancia por cabeza (plan)'),mx(r.profit),`${mx(r.profit*n)} ${T('batch','lote')}`,sign(r.profit))}${tile(T('Equipment cash up front','Equipo: efectivo inicial'),mx(equip),T('only a share counts in cost per head','solo una parte cuenta por cabeza'))}</div>
 <div class="row" style="margin-top:8px">${badge(p)}${gap?`<span class="tag q">${gap} ${T('lines have no price: real cost can be higher','renglones sin precio: el costo real puede ser mayor')}</span>`:''}</div>`)}

/* ---------- 2. how solid ---------- */
function solidCard(p){const s=solidity(p),P0=s.parts,t=s.total||1,w=v=>Math.max(0,v/t*100),warn=costWarnings(p),gap=missing(p),r=result(p),n=p.head,cush=co.cushion;
 const seg=(v,c,title)=>v>0?`<div title="${title}" style="width:${w(v)}%;background:${c}"></div>`:'';
 const row=(c,label,v)=>`<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c}"></span> ${label}</td><td class="r">${mx(v)}</td><td class="r mu">${Math.round(w(v))}%</td></tr>`;
 return card(T('How solid are these numbers?','¿Qué tan firmes son estos números?'),`<div style="display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin-bottom:8px">${seg(P0.good,'#2fbf71',T('quoted','cotizado'))}${seg(P0.weak,'#ffb000',T('not backed','sin respaldo'))}${seg(P0.inputs,'#5b6b7c',T('plan inputs','datos del plan'))}</div>
 <table>${row('#2fbf71',T('Cost lines with a recorded, current quote','Renglones con cotización vigente'),P0.good)}${row('#ffb000',T('Cost lines that are estimates or need re-checking','Renglones estimados o por revisar'),P0.weak)}${row('#5b6b7c',T('Animal, feed, interest and death reserve (typed in the plan, unverified)','Animal, alimento, interés y mortalidad (del plan, sin verificar)'),P0.inputs)}</table>
 ${warn.map(x=>`<div class="alert bad" style="margin-top:6px">${esc(x)}</div>`).join('')}
 <div style="margin-top:10px"><label class="sm">${T('Test a cushion for costs you have not priced, MXN per head','Pruebe un colchón para costos sin precio, MXN por cabeza')} <input id="ccush" type="number" min="0" step="100" value="${cush||''}" placeholder="0" style="width:110px"></label>
 ${cush>0?`<div class="alert ${r.profit-cush<0?'bad':''}" style="margin-top:6px">${T('With that cushion, profit would be','Con ese colchón la ganancia sería')} <b>${mx(r.profit-cush)}</b> ${T('per head','por cabeza')} (${mx((r.profit-cush)*n)} ${T('batch','lote')}). ${T('Test only; not saved.','Solo prueba; no se guarda.')}</div>`:`<div class="sm mu">${T('Room before this plan loses money','Margen antes de perder')}: <b>${r.profit>0?mx(r.profit)+' '+T('per head','por cabeza'):T('none','ninguno')}</b></div>`}</div>
 <div class="sm mu" style="margin-top:8px">${T(`A quote with no “valid until” date is flagged after ${QUOTE_DAYS} days. A recorded quote means you typed in its source; the terminal cannot verify it.`,`Una cotización sin vigencia se marca después de ${QUOTE_DAYS} días. La terminal no puede verificarla.`)}</div>`,'c7')}
/* Spanish, no amounts: safe to send to whoever is collecting prices */
function quoteMessage(p){const need=p.costs.filter(c=>['unpriced','old','changed','noproof'].includes(quoteState(c))&&c.st!=='na');
 const es={head:'por cabeza',batch:'por lote',day:'por cabeza al día',month:'por mes',invest:'compra de equipo'};
 return [`*Cotizaciones que faltan* · ${today()}`,`Lote de ${p.head} animales de ${p.w0} kg aprox.`,'',...need.map((c,i)=>`${i+1}. ${c.es||c.en} (${es[c.b]||''})`),...(need.length?['','De cada precio por favor manden: cuánto, qué incluye, quién lo dio, dónde, la fecha, hasta cuándo vale y foto del papel si hay.','Si algo no se necesita, avisen por qué. No paguen nada todavía.']:['No falta ninguna cotización de esta lista.'])].join('\n')}
function requestCard(p){const need=p.costs.filter(c=>['unpriced','old','changed','noproof'].includes(quoteState(c))&&c.st!=='na');
 return card(T('Price requests for the ranch (Spanish)','Pedir cotizaciones al rancho'),`<textarea id="cmsg" readonly style="min-height:230px">${esc(quoteMessage(p))}</textarea><div class="row" style="margin-top:8px"><button class="p" data-act="c-copy">${T('Copy message','Copiar mensaje')}${need.length?' ('+need.length+')':''}</button></div><div class="sm mu">${T('Lists lines with no price or a quote to re-check. No amounts are included. Nothing is sent for you.','Incluye renglones sin precio o por revisar. Sin montos. Nada se envía solo.')}</div>`,'c5')}

/* ---------- 3. editor ---------- */
const FILTERS={all:['All','Todos',()=>true],missing:['No price','Sin precio',s=>s==='unpriced'],check:['Estimate / re-check','Estimado / revisar',s=>['est','noproof','changed','old'].includes(s)],good:['Quoted','Cotizados',s=>s==='good'],na:['Not needed','No aplica',s=>s==='na']};
function quoteForm(p,c){const q=c.quote||{},f=(id,l,v,type='text')=>field(l,`<input id="${id}" type="${type}" value="${esc(v||'')}">`);
 return `<div style="background:var(--card2);border-radius:10px;padding:10px"><div class="f">${f('qf_src',T('Who gave the price','Quién dio el precio'),q.src)}${f('qf_loc',T('Place','Lugar'),q.loc)}${f('qf_d',T('Quote date','Fecha'),q.d,'date')}${f('qf_exp',T('Valid until (optional)','Vigencia (opcional)'),q.expires,'date')}${f('qf_ref',T('Receipt / where the proof is','Recibo / dónde está'),q.ref)}</div>
 <div class="row" style="margin-top:8px"><button class="p" data-act="c-qsave" data-id="${c.id}">${T('Record quote for','Registrar cotización de')} ${mx(c.a)} ${T(...CBASIS[c.b])}</button>${c.quote?`<button data-act="c-qdel" data-id="${c.id}">${T('Remove quote record','Quitar registro')}</button>`:''}<button data-act="c-qclose">${T('Close','Cerrar')}</button></div></div>`}
function lineBox(p,c,j,b,D){const one=lineHead(p,c,D),q=c.quote,stSel=c.st==='ok'?[['ok',T('quoted','cotizado')],['est',T('estimate','estimado')]]:[['q',T('needs price','falta precio')],['est',T('estimate','estimado')],['na',T('not needed','no aplica')]];
 return `<div class="cline"><div class="row" style="justify-content:space-between"><div style="flex:1;min-width:180px">${c.custom?inp(b+`costs.${j}.en`,c.en,'text',`aria-label="${T('Cost name','Nombre')}"`):`<b>${esc(cName(c))}</b>`}</div>${qTag(c)}</div>
 <div class="cgrid"><label>MXN${inp(b+`costs.${j}.a`,c.a)}</label><label>${T('How charged','Cómo se cobra')}<select data-set="${b}costs.${j}.b">${Object.entries(CBASIS).map(([k,v])=>`<option value="${k}" ${k===c.b?'selected':''}>${T(...v)}</option>`).join('')}</select></label>${c.b==='invest'?`<label>${T('Cycles it lasts','Ciclos que dura')}${inp(b+`costs.${j}.life`,c.life)}</label>`:''}<label>${T('Status','Estado')}<select data-set="${b}costs.${j}.st">${stSel.map(([k,v])=>`<option value="${k}" ${k===c.st?'selected':''}>${v}</option>`).join('')}</select></label>${c.custom?`<label>${T('Group','Grupo')}<select data-set="${b}costs.${j}.g">${CGROUPS.map(g=>`<option value="${g}" ${g===c.g?'selected':''}>${gn(g)}</option>`).join('')}</select></label>`:''}<div><span class="mu sm">${T('Per head · batch','Por cabeza · lote')}</span><br><b>${mx(one)}</b> · ${mx(one*p.head)}</div></div>
 <div class="row sm">${q&&q.src?`<span class="mu">${esc(q.src)}${q.loc?' · '+esc(q.loc):''} · ${q.d}${q.expires?' → '+q.expires:''}${q.ref?' · '+esc(q.ref):''}</span>`:''}<span style="flex:1"></span><button data-act="c-qopen" data-id="${c.id}">${q?T('Edit quote','Editar cotización'):T('Add quote','Agregar cotización')}</button><button data-act="delcost" data-id="${j}" aria-label="${T('Remove line','Quitar')}">✕</button></div>${co.edit===c.id?quoteForm(p,c):''}</div>`}
function editorCard(p){const i=S.plans.indexOf(p),b=`plans.${i}.`,D=totalDays(p),F=FILTERS[co.filter][2];
 const count=k=>p.costs.filter(c=>FILTERS[k][2](quoteState(c))).length;
 const groups=[...CGROUPS,...new Set(p.costs.map(c=>c.g).filter(g=>!CGROUPS.includes(g)))].map(g=>{const all=p.costs.map((c,j)=>({c,j})).filter(x=>x.c.g===g),show=all.filter(x=>F(quoteState(x.c)));if(!show.length)return '';
  const sub=all.reduce((s,x)=>s+lineHead(p,x.c,D),0),gap=all.filter(x=>x.c.st!=='na'&&!x.c.a).length,open=co.filter!=='all'||co.open.has(g);
  return `<details class="cg" data-g="${g}" ${open?'open':''}><summary><b>${g==='feed'?T('Feed extras (main feed is in the feeding stages)','Extras de alimento (el principal está en las etapas)'):GN[g]?gn(g):esc(g)}</b><span class="mu sm">${all.length} ${all.length===1?T('line','renglón'):T('lines','renglones')}${gap?` · <span style="color:var(--am)">${gap} ${T('no price','sin precio')}</span>`:''}</span><span style="flex:1"></span><span>${mx(sub)} <span class="mu sm">/${T('head','cab.')}</span> · ${mx(sub*p.head)}</span></summary>${show.map(x=>lineBox(p,x.c,x.j,b,D)).join('')}</details>`}).join('');
 return card(T('Every cost, by group (MXN)','Todos los costos, por grupo (MXN)'),`<div class="row seg">${Object.entries(FILTERS).map(([k,v])=>`<button data-act="c-filter" data-id="${k}" class="${co.filter===k?'on':''}">${T(v[0],v[1])} (${count(k)})</button>`).join('')}<span style="flex:1"></span><button data-act="c-openall">${T('Open / close all','Abrir / cerrar')}</button></div><p class="sm mu">${T('Tap a group to open it. “Not needed” is your own call: check it with the ranch, vet or authority first (permits and tests especially). Animal purchase, feed, interest and death reserve come from the plan inputs.','Toque un grupo para abrirlo. “No aplica” es su decisión: confirme primero (sobre todo permisos y pruebas).')}</p>${groups||`<p class="mu">${T('No lines match this filter.','Nada coincide.')}</p>`}<div class="row" style="margin-top:8px"><button data-act="c-add">+ ${T('My own cost','Costo propio')}</button></div>`)}
function inputsCard(p){const old=costsV1(),a=old.indexOf('>')+1,end=old.indexOf(`<section class="c "><h3>${T('Every cost you might have','Todos los costos posibles')}`);
 const inner=old.slice(a,end);return `<details class="c cg0" data-g="_inputs" ${co.open.has('_inputs')?'open':''}><summary><b>${T('Plan inputs and feeding stages','Datos del plan y etapas')}</b><span class="mu sm">${p.head} ${T('head','cabezas')} · ${p.w0} kg @ $${p.price} · ${totalDays(p)} ${T('days','días')} · ${T('sale','venta')} $${p.sale}/${unit(p)}</span></summary><div class="grid" style="margin-top:10px">${inner}</div></details>`}

/* ---------- 4. what moves profit ---------- */
function swings(p,pct){const k=pct/100,base=result(p).profit*p.head,flat=q=>({...q,phases:q.phases.map(f=>({...f,feed:feedDay(f),useRation:false}))}),pr=q=>result(q).profit*q.head;
 const list=[[T('Sale price','Precio de venta'),'−'+pct+'%',{...p,sale:p.sale*(1-k)}],
 [T('Daily gain (same sale date)','Ganancia diaria (misma fecha)'),'−'+pct+'%',{...p,phases:p.phases.map(f=>({...f,adg:f.adg*(1-k)}))}],
 [T('Buy price of the animal','Precio de compra'),'+'+pct+'%',{...p,price:p.price*(1+k)}],
 [T('Feed cost per day','Costo diario de alimento'),'+'+pct+'%',{...flat(p),phases:flat(p).phases.map(f=>({...f,feed:f.feed*(1+k)}))}],
 [T('All other cost lines','Los demás costos'),'+'+pct+'%',{...p,costs:p.costs.map(c=>({...c,a:c.a*(1+k)}))}],
 [T('Death-loss reserve','Reserva de mortalidad'),'+3 '+T('points','puntos'),{...p,mort:Math.min(100,p.mort+3)}]];
 return list.map(([name,how,q])=>({name,how,change:pr(q)-base,after:pr(q)})).sort((a,b)=>a.change-b.change)}
function moveCard(p){const rows=swings(p,co.swing),max=Math.max(1,...rows.map(x=>Math.abs(x.change))),r=result(p),feedRoom=r.c.feed>0?r.profit/r.c.feed*100:null,saleRoom=p.sale>0?(1-r.bePrice/p.sale)*100:null;
 return card(T('What hurts profit most','Lo que más afecta la ganancia'),`<div class="row sm"><span class="mu">${T('If each one alone goes against you by','Si cada uno va en contra por')}</span><select id="cswing">${[5,10,20,30].map(v=>`<option ${v===co.swing?'selected':''}>${v}</option>`).join('')}</select><span class="mu">%</span></div>
 <table style="margin-top:6px"><tr><th>${T('What changes','Qué cambia')}</th><th style="width:28%"></th><th class="r">${T('Batch profit change','Cambio del lote')}</th><th class="r">${T('Batch profit after','Ganancia después')}</th></tr>${rows.map(x=>`<tr><td>${x.name} <span class="mu sm">${x.how}</span></td><td><div class="bar" style="width:${Math.abs(x.change)/max*100}%;background:#d95926"></div></td><td class="r">${mx(x.change)}</td><td class="r ${sign(x.after)}">${mx(x.after)}</td></tr>`).join('')}</table>
 <div class="tiles" style="margin-top:8px">${tile(T('Max buy price before a loss','Compra máxima sin perder'),r.maxBuy>0?'$'+f1(r.maxBuy)+'/kg':T('None','Ninguno'),T('you entered','usted puso')+' $'+p.price,r.maxBuy>=p.price?'':'dn')}${tile(T('Sale price can fall by','El precio de venta puede bajar'),saleRoom==null?'—':saleRoom>0?f1(saleRoom)+'%':T('Already losing','Ya pierde'),'',saleRoom>0?'':'dn')}${tile(T('Feed cost can rise by','El alimento puede subir'),feedRoom==null?'—':feedRoom>0?f1(feedRoom)+'%':T('Already losing','Ya pierde'),'',feedRoom>0?'':'dn')}</div><div class="row" style="margin-top:6px">${badge(p)}</div><div class="sm mu">${T('One change at a time; in real life several can happen together. These are tests, not forecasts or odds.','Un cambio a la vez; en la realidad pueden juntarse. Son pruebas, no pronósticos.')}</div>`)}

/* ---------- 5. cash timing ---------- */
function cashCard(p){const f=cashFlow(p),max=Math.max(1,...f.rows.map(x=>x.out)),st=statements();let run=0;
 return card(T('When you will need the cash (batch)','Cuándo se necesita el dinero (lote)'),`<div class="tiles">${tile(T('Needed at the start','Se necesita al inicio'),mx(f.rows[0].out),p.start)}${tile(T('Total cash to spend','Efectivo total a gastar'),mx(f.spend),usd(f.spend))}${tile(T('Plus your reserve','Más su reserva'),mx(f.required),T('reserve','reserva')+' '+mx(S.biz.reserve))}${tile(T('Cash recorded in Books now','Efectivo en Libros hoy'),money2(st.cash),T('target','meta')+' '+mx(S.biz.capital)+' '+T('is not money you have','no es dinero depositado'))}</div>
 <div class="scroll" style="margin-top:8px"><table><tr><th>${T('Month','Mes')}</th><th>${T('Approx. date','Fecha aprox.')}</th><th style="width:34%"></th><th class="r">${T('Spend','Gasto')}</th><th class="r">${T('Total so far','Acumulado')}</th></tr>${f.rows.map(x=>{run+=x.out;return `<tr><td>${x.m===0?T('Start','Inicio'):x.m}</td><td>${addD(p.start,x.day)}</td><td><div class="bar" style="width:${x.out/max*100}%"></div></td><td class="r">${mx(x.out)}</td><td class="r">${mx(run)}</td></tr>`}).join('')}</table></div>
 <div class="sm mu">${T('Plan estimate. Equipment is counted in full at the start. Interest and the death reserve are not cash payments. Sale money is not counted as available. Real payment dates may differ, and lines with no price count as $0.','Estimado del plan. El equipo se paga completo al inicio. No cuenta el dinero de la venta. Renglones sin precio cuentan $0.')} <button data-act="go" data-id="project">${T('Cash & 5-year','Flujo y 5 años')} →</button></div>`,'c7')}

/* ---------- 6. budget vs spent ---------- */
function budgetRows(p){const g=result(p).c,D=totalDays(p),n=p.head,by=statements().byCat,got=ks=>ks.reduce((s,k)=>s+(by[k]||0),0)/100,sum=f=>p.costs.filter(f).reduce((s,c)=>s+lineHead(p,c,D),0);
 const equip=p.costs.filter(c=>c.b==='invest').reduce((s,c)=>s+c.a,0),notInv=gr=>sum(c=>c.g===gr&&c.b!=='invest')*n;

const stageName=f=>T(f.en,f.es);
const stageStart=(p,j)=>p.phases.slice(0,j).reduce((s,f)=>s+f.d,0);
function stageAt(p,day){let t=0;for(let j=0;j<p.phases.length;j++){t+=p.phases[j].d;if(day<t)return j}return p.phases.length-1}
function planDay(p){const raw=days(p.start,today()),D=totalDays(p);return{raw,D,day:Math.min(Math.max(0,raw),Math.max(0,D-1)),state:raw<0?'before':raw>=D?'after':'in'}}
const ings=f=>f.ration.filter(x=>x.kg>0);
const rationKg=f=>ings(f).reduce((s,x)=>s+x.kg,0);
const dmKnown=f=>ings(f).length>0&&ings(f).every(x=>x.dm>0&&x.dm<=100);
const dmKg=f=>ings(f).reduce((s,x)=>s+x.kg*(x.dm||0)/100,0);
const protG=f=>ings(f).reduce((s,x)=>s+x.kg*(x.cp||0)*10,0);
/* who is eating and drinking: the planned batch, or the animals actually recorded */

/* a review belongs to one exact ration: any change to what is fed, the starting weight or the stage makes it stale */
const rationSnap=(p,f)=>JSON.stringify([p.w0,f.d,f.adg,ings(f).map(x=>[String(x.n).trim(),x.kg,x.dm||0,x.cp||0]).sort()]);
function reviewState(p,f){if(!ings(f).length)return 'empty';const r=f.review;if(!r||!r.who||!r.d)return 'none';return r.snap===rationSnap(p,f)?'ok':'changed'}
const RV={empty:['no ration entered','sin ración'],none:['not reviewed','sin revisar'],changed:['changed since review','cambió desde la revisión'],ok:['review recorded','revisión registrada']};
const rvTag=(p,f)=>{const s=reviewState(p,f);return `<span class="tag ${s==='ok'?'':'q'}" style="white-space:normal;${s==='ok'?'color:var(--up);border-color:var(--up)':''}">${T(...RV[s])}</span>`};
function recordReview(p,f,x){if(!ings(f).length)return T('Enter the ration first.','Capture primero la ración.');if(ings(f).some(i=>!String(i.n).trim()))return T('Every ingredient with kg needs a name.','Cada ingrediente necesita nombre.');if(!x.who.trim())return T('Enter the name of the person who reviewed it.','Capture quién la revisó.');if(!/^\d{4}-\d\d-\d\d$/.test(x.d)||x.d>today())return T('Enter the review date (not in the future).','Fecha de revisión (no futura).');
 f.review={who:x.who.trim(),role:x.role==='vet'?'vet':'nutri',d:x.d,note:(x.note||'').trim(),snap:rationSnap(p,f)};return ''}
const roleName=r=>r==='vet'?T('Veterinarian','Veterinario'):T('Animal nutritionist','Nutriólogo animal');
/* name checks only: they cannot find every unsafe ingredient, and passing them does not mean safe */
const RISKY=[[/urea|\bnnp\b|non.?protein|nitr[oó]geno no|amon[ií]|ammoni/i,['Urea or non-protein nitrogen can poison cattle if mixed or fed wrong. Use only as a nutritionist or vet directs.','La urea puede intoxicar al ganado. Solo como indique el nutriólogo o veterinario.']],
 [/pollinaza|gallinaza|poultry (litter|waste|manure)|chicken (litter|manure)|cama de pollo|excreta/i,['Poultry litter or waste carries health and legal risk. Confirm with your vet and SENASICA before any use.','La pollinaza tiene riesgos sanitarios y legales. Confirme con veterinario y SENASICA antes de usarla.']],
 [/bone meal|meat meal|blood meal|harina de (carne|hueso|sangre)/i,['Animal-origin meals can be prohibited for cattle. Do not feed without confirming with your vet and SENASICA.','Las harinas de origen animal pueden estar prohibidas para bovinos. Confirme con veterinario y SENASICA.']],
 [/monensin|lasalocid|ionof|ionoph|antibi|clenbuterol|zilpaterol|ractopamin|implant|hormon|medic/i,['Medicine or growth additive: only a veterinarian decides, and some are illegal.','Medicamento o aditivo: solo el veterinario decide, y algunos son ilegales.']]];

/* ---------- purchase math ---------- */
/* kg needed between two plan days, per ingredient, for the planned batch */
function needs(p,from,len,waste){const to=Math.min(totalDays(p),from+len),map=new Map(),blind=[];
 p.phases.forEach((f,j)=>{const a=stageStart(p,j),n=Math.max(0,Math.min(to,a+f.d)-Math.max(from,a));if(!n)return;if(!ings(f).length){blind.push({f,n});return}
  for(const x of ings(f)){const key=String(x.n).trim().toLowerCase()||'?',e=map.get(key)||{key,name:String(x.n).trim()||'?',kg:0,cost:0,unpriced:0,pack:0,packs:new Set()};const kg=x.kg*n*p.head*(1+waste/100);e.kg+=kg;if(x.p>0)e.cost+=kg*x.p;else e.unpriced+=kg;if(x.pack>0)e.packs.add(x.pack);map.set(key,e)}});
 const rows=[...map.values()].map(e=>({...e,pack:e.packs.size===1?[...e.packs][0]:0}));return{rows,blind,from,to}}
const stockNow=s=>Math.max(0,s.kg-(s.use||0)*Math.max(0,days(s.date,today())));
const stockKey=s=>String(s.ing||s.n).trim().toLowerCase();
function shopping(p){const pd=planDay(p),len=fo.win||pd.D,from=pd.state==='after'?pd.D:pd.day,N=needs(p,from,len,S.feedcfg.waste);
 N.rows=N.rows.map(r=>{const have=S.stock.filter(s=>stockKey(s)===r.key).reduce((t,s)=>t+stockNow(s),0),buy=Math.max(0,r.kg-have),share=r.kg?buy/r.kg:0;return{...r,have,buy,buyCost:r.cost*share,buyUnpriced:r.unpriced*share,units:r.pack?Math.ceil(buy/r.pack-1e-9):null}});return N}
/* real use between the last two counts */
function measured(s){const c=[...(s.counts||[])].sort((a,b)=>a.d.localeCompare(b.d));if(c.length<2)return null;const a=c[c.length-2],b=c[c.length-1],n=days(a.d,b.d);if(n<1)return null;const used=a.kg+(b.recv||0)-b.kg;return{perDay:used/n,n,bad:used<0}}
function countStock(s,x){if(!(x.kg>=0)||x.kg==='')return T('Enter the kg counted.','Capture los kg contados.');if(x.recv<0||x.kg<0)return T('Amounts cannot be negative.','No pueden ser negativos.');if(!/^\d{4}-\d\d-\d\d$/.test(x.d)||x.d>today())return T('Enter the count date (not in the future).','Fecha del conteo (no futura).');if(x.d<s.date)return T('That date is before the last count.','La fecha es anterior al último conteo.');
 if(!s.counts||!s.counts.length)s.counts=[{id:uid(),d:s.date,kg:s.kg,recv:0}];s.counts.push({id:uid(),d:x.d,kg:+x.kg,recv:+x.recv||0});s.counts=s.counts.slice(-24);s.kg=+x.kg;s.date=x.d;return ''}

function waterNeed(p,day){const W=S.water,e=eaters(p,day),kg=e.kg+W.extraN*W.extraW,lo=kg/100*W.lo,hi=kg/100*W.hi;return{lo,hi,kg,n:e.n+W.extraN}}
function cistern(p){const W=S.water,need=waterNeed(p,planDay(p).day).hi;if(!(W.level>0)||!W.levelDate||!(need>0))return null;const left=Math.max(0,W.level-need*Math.max(0,days(W.levelDate,today())));return{left,days:left/need,stale:days(W.levelDate,today())>7}}
/* truck water for the planned batch only, averaged over the whole plan, at the high end of the range */

/* ---------- what has to be true ---------- */
function solve(lo,hi,ok){if(!ok(hi))return null;if(ok(lo))return lo;for(let i=0;i<50;i++){const m=(lo+hi)/2;ok(m)?hi=m:lo=m}return hi}
function limits(p){const r=result(p),D=r.D,gm=m=>result({...p,phases:p.phases.map(f=>({...f,adg:f.adg*m}))}).profit,m=solve(0,5,x=>gm(x)>=0),adg=D>0?(r.w-p.w0)/D:0,out=[];
 const add=(id,name,plan,limit,unitTxt,dir)=>{const room=limit==null||!(plan>0)?null:(dir==='min'?(plan-limit)/plan:(limit-plan)/plan)*100;out.push({id,name,plan,limit,unitTxt,dir,room,ok:limit!=null&&(dir==='min'?plan>=limit-1e-9:plan<=limit+1e-9)})};
 add('sale',T('Sale price at least','Precio de venta al menos'),p.sale,r.kgc>0?r.bePrice:null,'$/kg','min');
 add('buy',T('Buy price at most','Precio de compra máximo'),p.price,r.maxBuy>0?r.maxBuy:null,'$/kg','max');
 add('gain',T('Average daily gain at least','Ganancia diaria al menos'),adg,m==null?null:adg*m,'kg','min');
 if(r.c.feed>0){const v=r.c.feed+r.profit;add('feed',T('Feed cost per head at most','Alimento por cabeza máximo'),r.c.feed,v>=0?v:null,'$','max')}
 /* a lost animal brings no sale money; its costs are still counted in full */
 if(r.rev>0){const v=(1-(r.c.total-r.c.risk)/r.rev)*100;add('mort',T('Share of animals lost (no sale) at most','Animales perdidos (sin venta) máximo'),p.mort,v>=0?Math.min(100,v):null,'%','max')}
 if(p.basis==='carcass'&&p.sale>0)add('yld',T('Dressing yield at least','Rendimiento al menos'),p.yld,r.w>0&&p.shrink<100?(r.c.total/(r.w*(1-p.shrink/100)*p.sale))*100:null,'%','min');
 return out}
function limitsCard(p){const L=limits(p),show=(v,u)=>v==null?T('not possible','imposible'):u==='$'?mx(v):u==='$/kg'?'$'+f1(v):u==='%'?f1(v)+'%':(Math.round(v*1000)/1000)+' kg';

 <div class="row" style="margin-top:8px"><button data-act="d-print">${T('Print decision summary / PDF','Imprimir resumen / PDF')}</button><span class="sm mu">${T('Includes your money figures. Check before sharing.','Incluye sus cifras.')}</span></div>`)}
function decideSheet(p){const g=gates(p),r=result(p),j=[...S.decisions].reverse().filter(x=>x.plan===p.name)[0];
 return `<h2>${T('Decision summary','Resumen de decisión')} · ${today()}</h2><p>${esc(p.name)} · ${p.head} ${T('head','cabezas')} · ${r.D} ${T('days','días')} · MXN. ${T('Planning estimate, not audited, not financial advice.','Estimado, sin auditoría, no es asesoría.')} <b>${buyerState(p).label}</b></p><h3>${T('Readiness','Preparación')}: ${g.filter(x=>x.ok).length}/${g.length}</h3>${tbl(['',T('Item','Punto'),T('Detail','Detalle')],g.map(x=>[x.ok?'✓':'✕',x.label,x.detail]))}<h3>${T('Limits to not lose money','Límites para no perder')}</h3>${tbl(['',T('Limit','Límite'),T('Plan','Plan')],limits(p).map(x=>[x.name,x.limit==null?T('not possible','imposible'):f1(x.limit)+' '+x.unitTxt,f1(x.plan)+' '+x.unitTxt]))}<h3>${T('Tests, batch profit','Pruebas, ganancia del lote')}</h3>${tbl(['',T('Profit','Ganancia'),T('Cash needed','Efectivo')],['optimistic','base','conservative','adverse'].map(k=>{const q=stressed(p,k);return[T(SCEN[k][0],SCEN[k][1]),mx(result(q).profit*q.head),mx(cashFlow(q).required)]}))}${j?`<h3>${T('Latest decision for this plan','Última decisión')}</h3><p><b>${CHOICE[j.choice]?T(...CHOICE[j.choice]):''}</b> · ${esc(j.d)}: ${esc(j.why)}</p>`:''}`}

V.decide=()=>{const p=P();return `<div class="grid">${verdictCard(p)}${offerCard(p)}${sellerCard()}${savedCard(p)}${limitsCard(p)}${stressCard(p)}${sellCard(p)}${keepCard(p)}${proofCard()}${plansCard()}${gridsCard(p)}${journalCard(p)}</div>`};
const redecide=()=>{const keep={};for(const id of ['kw','kg','kc','kp','kq','kanimal','dj_choice','dj_why']){const el=$('#'+id);if(el)keep[id]=el.value}const y=scrollY;render();for(const[id,v]of Object.entries(keep)){const el=$('#'+id);if(el)el.value=v}calcKeep();scrollTo(0,y)};
const offerLive=()=>{for(const k of Object.keys(dc.offer)){const el=$('#o_'+k);if(el)dc.offer[k]=el.value}const out=$('#offerOut');if(out)out.innerHTML=offerResult(P())};
document.addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.dg)dc.grids=e.target.open},true);

document.addEventListener('change',e=>{const t=e.target;if(tab!=='decide')return;
 if(t.dataset.shock){dc.shock[t.dataset.shock]=+t.value;t.blur();redecide()}
 else if(t.id==='late_adg'||t.id==='late_drift'){if(t.id==='late_adg')dc.late.adg=t.value===''?null:Math.max(0,+t.value||0);else dc.late.drift=Math.max(-20,Math.min(20,+t.value||0));t.blur();redecide()}
 else if(t.id==='kanimal'){const a=S.herd.find(x=>x.id===t.value);if(a){$('#kw').value=lastW(a).w;calcKeep()}}
 else if(t.dataset.proof!==undefined){S.checkInfo[t.dataset.proof]=Object.assign({note:'',d:''},S.checkInfo[t.dataset.proof]);S.checkInfo[t.dataset.proof][t.dataset.k]=t.value;if(t.dataset.k==='note'&&t.value.trim()&&!S.checkInfo[t.dataset.proof].d)S.checkInfo[t.dataset.proof].d=today();save();
  setTimeout(()=>{if(!(document.activeElement&&document.activeElement.dataset.proof!==undefined))redecide()},150)}
 else if(t.dataset.act==='check')setTimeout(redecide,0)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;if(!a.startsWith('d-'))return;const p=P();
 if(a==='d-copy'){const t=$('#dmsg');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(()=>document.execCommand('copy'));b.textContent=T('Copied ✓','Copiado ✓')}
 else if(a==='d-save'){const o=readOffer(dc.offer),err=offerProblem(o);if(err)return alert(err);S.offers.push({id:uid(),d:today(),...o});dc.offer={who:'',head:'',w:'',price:'',by:'kg',extra:''};save();redecide()}
 else if(a==='d-deloffer'){if(!confirm(T('Delete this saved offer?','¿Borrar la oferta?')))return;S.offers=S.offers.filter(x=>x.id!==id);save();redecide()}
 else if(a==='d-use'){const o=S.offers.find(x=>x.id===id);if(!o)return;if(!confirm(T('Make a NEW plan with this offer’s head, weight and price? Your current plan is not changed. Nothing is bought.','¿Crear un plan NUEVO con esta oferta? El plan actual no cambia. No se compra nada.')))return;
  const q=JSON.parse(JSON.stringify(offerPlan(p,{...o,head:Math.max(1,Math.round(+o.head))})));q.id=uid();q.name=`${T('Offer','Oferta')}: ${o.who||o.d} (${q.head} × ${o.w} kg)`;q.costs.forEach(c=>{if(c.id==='offerx'){c.id=uid();c.custom=true}});S.plans.push(q);S.plan=q.id;save();redecide()}
 else if(a==='d-journal'){const choice=val('dj_choice'),why=val('dj_why'),open=gates(p).filter(g=>!g.ok).length;if(!CHOICE[choice]||!why.trim())return alert(recordDecision(p,choice,why));
  if(choice==='go'&&open&&!confirm(T(`${open} readiness items are still open. Record “Go ahead” anyway?`,`Faltan ${open} puntos. ¿Registrar “Seguir adelante” de todos modos?`)))return;recordDecision(p,choice,why);save();const y=scrollY;render();scrollTo(0,y)}
 else if(a==='d-deljournal'){if(!confirm(T('Delete this journal entry?','¿Borrar esta nota?')))return;S.decisions=S.decisions.filter(x=>x.id!==id);save();redecide()}
 else if(a==='d-print'){let el=$('#growsheet');if(!el){el=document.createElement('div');el.id='growsheet';document.body.appendChild(el)}el.innerHTML=decideSheet(p);document.body.classList.add('printgrow');window.print()}});
/* ===== cash & 5-year page. Planning only: sale money is never counted before it is paid. ===== */
const cp_={src:'target',custom:0,scen:'base',delay:0,lateGain:0,lag:0,shock:0,shockMonth:3,fx:null,bad:2};
const SRC={target:['My target (NOT deposited)','Mi meta (NO depositada)'],books:['Cash recorded in Books','Efectivo en Libros'],custom:['An amount I type','Un monto que escribo']};
const startMoney=()=>cp_.src==='books'?statements().cash/100:cp_.src==='custom'?cp_.custom:S.biz.capital;
const scenPlan=(p,k)=>k==='base'?p:stressed(p,k);
/* month-by-month cash. With no delay, lag or surprise it matches cashFlow(). */
function cashPlan(p,o={}){const D=totalDays(p),capital=o.capital??S.biz.capital,delay=Math.max(0,Math.round(o.delay||0)),lag=Math.max(0,Math.round(o.lag||0)),saleDay=D+delay,payDay=saleDay+lag,last=p.phases.at(-1);
 const equip=p.costs.filter(c=>c.b==='invest').reduce((s,c)=>s+c.a,0),q={...p,rate:0,costs:p.costs.filter(c=>c.b!=='invest')};
 const base=day=>{if(!p.head)return 0;const g=costAt(q,day);return(g.total-g.risk)*p.head+equip};
 const saleCosts=p.costs.filter(c=>c.g==='sale'&&(c.b==='head'||c.b==='batch')).reduce((s,c)=>s+(c.b==='head'?c.a*p.head:c.a),0);
 /* while a sale is late, the animals still eat and the daily and monthly bills continue */
 const daily=p.head?feedDay(last)*p.head+p.costs.reduce((s,c)=>s+(c.b==='day'?c.a*p.head:c.b==='month'?c.a/30.4:0),0):0;
 const spendTo=day=>base(Math.min(day,D))-(delay&&p.head&&day>=D&&day<saleDay?saleCosts:0)+daily*Math.max(0,Math.min(day,saleDay)-D);
 const w=atDay(delay?{...p,phases:[...p.phases,{...last,d:delay,adg:Math.max(0,o.lateGain||0)}]}:p,saleDay).w,income=revenue(p,w)*p.head*(1-p.mort/100);
 const n=Math.ceil(payDay/30.4-0.05),set=new Set([0,saleDay,payDay]);for(let m=1;m<n;m++)set.add(Math.min(payDay,Math.round(m*30.4)));
 const dayList=[...set].sort((a,b)=>a-b),shock=Math.max(0,o.shock||0),shockDay=Math.min(payDay,Math.round(Math.max(0,o.shockMonth||0)*30.4));let prev=0,paid=0,hit=false,low=Infinity,lowDay=0,got=0;
 const rows=dayList.map((day,i)=>{let out=spendTo(day)-prev;prev=spendTo(day);if(!hit&&shock&&day>=shockDay){out+=shock;hit=true}paid+=out;
  const before=capital-paid+got;if(before<low){low=before;lowDay=day}const inc=day===payDay?income:0;got+=inc;return{i,day,date:addD(p.start,day),out,income:inc,paid,cash:capital-paid+got,sale:day===saleDay}});
 return{rows,low,lowDay,end:rows.at(-1).cash,spend:paid,revenue:income,profit:income-paid,required:paid+S.biz.reserve,ok:low>=S.biz.reserve-0.005,w,saleDay,payDay,capital}}
const curPlan=p=>cashPlan(scenPlan(p,cp_.scen),{capital:startMoney(),delay:cp_.delay,lateGain:cp_.lateGain,lag:cp_.lag,shock:cp_.shock,shockMonth:cp_.shockMonth});
const cfx=()=>cp_.fx>0?cp_.fx:S.fx;
const dollars=(v,rate=S.fx)=>rate>0?'US$'+Math.round(v/rate).toLocaleString('en-US'):'—';

/* ---------- 1. funding ---------- */
function planSpent(p){return activeBook().filter(x=>['expense','capital','animal_purchase'].includes(x.type)&&x.d>=p.start).reduce((s,x)=>s+x.c,0)/100}
function fundCard(p){const st=statements(),need=cashFlow(p).required,have=st.cash/100,gap=need-have,tgap=need-S.biz.capital,spent=planSpent(p);
 return card(T('Can the money carry this batch?','¿Alcanza el dinero para este lote?'),`<div class="alert ${gap>0?'bad':'good'}"><b style="font-size:18px">${gap>0?`${T('Still to fund','Falta fondear')}: ${mx(gap)} (${dollars(gap)})`:T('Cash recorded in Books covers the plan plus reserve','El efectivo en Libros cubre plan y reserva')}</b><br><span class="sm">${T('Plan spending plus protected reserve','Gasto del plan más reserva')} ${mx(need)} · ${T('cash recorded in Books','efectivo en Libros')} ${mx(have)}</span></div>
 ${spent>0?`<div class="alert">${T(`Books already show ${mx(spent)} of spending since this plan’s start date. The gap above does not subtract it from what is still to be spent, so it may be overstated.`,`Libros ya muestra ${mx(spent)} gastados desde el inicio; la falta puede estar inflada.`)}</div>`:''}
 <div class="f" style="margin-top:8px">${field(T('Starting capital target (not deposited)','Meta de capital (no depositada)'),inp('biz.capital',S.biz.capital))}${field(T('Protected emergency reserve','Reserva de emergencia'),inp('biz.reserve',S.biz.reserve))}</div>
 <div class="tiles" style="margin-top:8px">${tile(T('Needed with reserve','Se ocupa con reserva'),mx(need),dollars(need))}${tile(tgap>0?T('Target is short by','La meta no alcanza por'):T('Target would leave spare','La meta dejaría de sobra'),mx(Math.abs(tgap)),T('only if you actually deposit it','solo si la deposita'),tgap>0?'dn':'')}${tile(T('Head recorded cash covers','Cabezas con efectivo en Libros'),maxHerd(p,Math.max(0,have)),T('ignores land, water, labor','sin terreno, agua, trabajo'))}${tile(T('Head the target would cover','Cabezas que cubriría la meta'),maxHerd(p,S.biz.capital),T('not money you have yet','dinero que aún no tiene'))}</div>
 ${missing(p).length?`<div class="sm" style="color:var(--am)">${missing(p).length} ${T('cost lines have no price, so the real amount needed can be higher.','costos sin precio: se puede ocupar más.')}</div>`:''}`)}

/* ---------- 2. timeline ---------- */
function cashSVG(c){const W=innerWidth<600?360:1080,H=230,L=52,R=W-12,B=H-26,vals=[...c.rows.map(r=>r.cash),c.low,S.biz.reserve,0,c.capital];let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<1)hi=lo+1;
 const span=hi-lo,step=[1,2,2.5,5,10].map(k=>k*10**Math.floor(Math.log10(span/4))).find(v=>v*4>=span);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
 const end=c.payDay||1,X=d=>L+d/end*(R-L),Y=v=>10+(hi-v)/(hi-lo)*(B-10);let g='';
 for(let v=lo;v<=hi+step/2;v+=step)g+=`<line x1="${L}" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#262d36"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" fill="#8b95a1" font-size="11">${Math.round(v/1000)}k</text>`;
 const nT=W<500?3:6;for(let i=0;i<=nT;i++){const d=Math.round(end*i/nT);g+=`<text x="${X(d)}" y="${H-6}" text-anchor="${i===0?'start':i===nT?'end':'middle'}" fill="#8b95a1" font-size="11">${addD(P().start,d).slice(0,7)}</text>`}
 if(lo<0)g+=`<line x1="${L}" x2="${R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#8b95a1"/>`;
 g+=`<line x1="${L}" x2="${R}" y1="${Y(S.biz.reserve)}" y2="${Y(S.biz.reserve)}" stroke="#ffb000" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${R}" y="${Y(S.biz.reserve)-5}" text-anchor="end" fill="#ffb000" font-size="11">${T('reserve','reserva')}</text>`;
 /* money moves in steps between month points; cash from the sale appears only on payment day */
 let d=`M${X(0)} ${Y(c.rows[0].cash)}`;for(let i=1;i<c.rows.length;i++){const r=c.rows[i],pre=r.cash-r.income;d+=`L${X(r.day)} ${Y(pre)}`+(r.income?`L${X(r.day)} ${Y(r.cash)}`:'')}
 g+=`<path d="${d}" fill="none" stroke="#3987e5" stroke-width="2"/>`+c.rows.map(r=>`<circle cx="${X(r.day)}" cy="${Y(r.cash)}" r="4" fill="${r.cash<S.biz.reserve?'#f0605d':'#3987e5'}" stroke="#12161b" stroke-width="2"/><rect class="cpt" data-i="${r.i}" x="${X(r.day)-12}" y="0" width="24" height="${B}" fill="transparent"><title>${r.date}: ${mx(r.cash)}</title></rect>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="${T('Planned cash balance over time','Efectivo planeado en el tiempo')}">${g}</svg>`}
const readout=(c,i)=>{const r=c.rows[i];return r?`<b>${r.date}</b> · ${T('spend','gasto')} ${mx(r.out)}${r.income?` · ${T('before the buyer pays','antes del pago')} <b>${mx(r.cash-r.income)}</b> · ${T('buyer pays','paga el comprador')} ${mx(r.income)}`:''} · ${T('cash after','efectivo')} <b class="${r.cash<S.biz.reserve?'dn':''}">${mx(r.cash)}</b>`:''};
let CP=null;
function timelineCard_c(p){const c=CP=curPlan(p),base=cashPlan(p,{capital:startMoney()}),num_=(l,k,extra='')=>`<label>${l}<input type="number" min="0" step="any" data-cp="${k}" value="${cp_[k]||0}" ${extra}></label>`,changed=cp_.scen!=='base'||cp_.delay||cp_.lag||cp_.shock;
 return card(T('Cash over time (batch)','Efectivo en el tiempo (lote)'),`<div class="cgrid"><label>${T('Starting money to test with','Dinero inicial a probar')}<select data-cp="src">${Object.entries(SRC).map(([k,v])=>`<option value="${k}" ${cp_.src===k?'selected':''}>${T(...v)}</option>`).join('')}</select></label>${cp_.src==='custom'?num_(T('Amount, MXN','Monto, MXN'),'custom'):''}<label>${T('Conditions','Condiciones')}<select data-cp="scen">${Object.entries(SCEN).map(([k,v])=>`<option value="${k}" ${cp_.scen===k?'selected':''}>${T(v[0],v[1])}</option>`).join('')}</select></label>${num_(T('Sale happens late, days','Venta se atrasa, días'),'delay')}${cp_.delay?num_(T('Gain while waiting, kg/day','Ganancia mientras espera'),'lateGain'):''}${num_(T('Buyer pays after sale, days','Comprador paga después, días'),'lag')}${num_(T('Surprise cost, MXN','Gasto inesperado, MXN'),'shock')}${cp_.shock?num_(T('…in plan month','…en el mes'),'shockMonth'):''}</div>
 ${cp_.src!=='books'?`<div class="sm" style="color:var(--am);margin-top:6px">${cp_.src==='target'?T('This test uses your target. It is not money you have recorded.','Usa su meta; no es dinero registrado.'):T('This test uses an amount you typed.','Usa un monto escrito.')}</div>`:''}
 <div style="margin-top:8px">${cashSVG(c)}</div><div class="sm" id="cread">${readout(c,c.rows.findIndex(r=>r.day===c.lowDay))}</div>
 <div class="tiles" style="margin-top:8px">${tile(T('Lowest cash','Efectivo mínimo'),mx(c.low),addD(p.start,c.lowDay),c.ok?'up':'dn')}${tile(T('Cash after buyer pays','Efectivo tras el pago'),mx(c.end),addD(p.start,c.payDay),sign(c.end-c.capital))}${tile(T('Cash profit, no interest','Ganancia en efectivo'),mx(c.profit),changed?`${c.profit-base.profit<0?'':'+'}${mx(c.profit-base.profit)} ${T('vs plan','vs plan')}`:dollars(c.profit),sign(c.profit))}${tile(T('Sale weight','Peso de venta'),Math.round(c.w)+' kg',underMin(p,c.w)||addD(p.start,c.saleDay))}</div>
 ${c.low<0?`<div class="alert bad"><b>${T('Cash runs out','Se acaba el efectivo')}:</b> ${T('short by','faltan')} ${mx(-c.low)} ${T('before the buyer pays.','antes del pago.')}</div>`:!c.ok?`<div class="alert bad">${T('This dips into the protected reserve by','Toca la reserva por')} ${mx(S.biz.reserve-c.low)}.</div>`:`<div class="alert good">${T('Stays above the reserve in this test.','Se mantiene sobre la reserva en esta prueba.')}</div>`}
 <details class="sm" data-cd="table" ${cp_.table?'open':''}><summary>${T('Show as a table','Ver como tabla')}</summary>${tbl([T('Date','Fecha'),T('Spend','Gasto'),T('Buyer pays','Pago'),T('Cash after','Efectivo')],c.rows.map(r=>[r.date+(r.sale?' · '+T('sale','venta'):''),mx(r.out),r.income?mx(r.income):'—',`<span class="${r.cash<S.biz.reserve?'dn':''}">${mx(r.cash)}</span>`]))}</details>
 <div class="sm mu">${T('Estimate. Equipment is paid in full at the start; interest is left out; the sale is reduced by your death-loss %. Cattle are never counted as cash before the buyer pays. While a sale is late, feed and daily and monthly bills continue.','Estimado. El ganado no cuenta como efectivo hasta que paga el comprador.')}</div><div class="row">${badge(p)}</div>`)}

/* ---------- 3. money to send ---------- */
function sendRows(p){const c=cashPlan(scenPlan(p,cp_.scen),{capital:0,delay:cp_.delay,lateGain:cp_.lateGain,lag:cp_.lag,shock:cp_.shock,shockMonth:cp_.shockMonth});let had=0;
 /* total that must have gone in by each date so that every bill is paid and the reserve is untouched */
 return c.rows.filter(r=>r.out>0.5||r.day===0).map(r=>{const total=r.paid+S.biz.reserve,add=total-had;had=total;return{date:r.date,add,total}})}
function sendCard(p){const rows=sendRows(p),rate=cfx(),eq=statements().equity/100,total=rows.length?rows.at(-1).total:0,weaker=rate>0?total/(rate*0.9)-total/rate:0;
 return card(T('Money to send, and by when','Dinero a enviar y para cuándo'),`<div class="row sm"><label>${T('Test exchange rate, MXN per US$','Tipo de cambio a probar')} <input type="number" step="any" min="0" data-cp="fx" value="${rate}" style="width:90px"></label><span class="mu">${T('header rate','tipo del encabezado')}: ${S.fx} (${T('you typed it; not a live quote','usted lo capturó; no es en vivo')})</span></div>
 <div class="scroll"><table style="margin-top:6px"><tr><th>${T('Have it there by','Tenerlo allá antes del')}</th><th class="r">${T('Send MXN','Enviar MXN')}</th><th class="r">≈ US$</th><th class="r">${T('Total in','Total puesto')}</th></tr>${rows.map(r=>`<tr><td>${r.date}</td><td class="r"><b>${mx(r.add)}</b></td><td class="r">${dollars(r.add,rate)}</td><td class="r">${mx(r.total)}${eq>=r.total-0.5?' <span class="up">✓</span>':''}</td></tr>`).join('')}</table></div>

const BK_TEXT={none:['AUTO BACKUP OFF','RESPALDO AUTO APAGADO'],ok:['AUTO BACKUP OK','RESPALDO AUTO OK'],paused:['BACKUP PAUSED · click','RESPALDO EN PAUSA · clic'],error:['BACKUP ERROR · click','ERROR DE RESPALDO · clic'],guard:['BACKUP PROTECTED · click','RESPALDO PROTEGIDO · clic']};

 if(bkState==='paused')return T('Chrome needs your permission again. Click the button and allow saving.','Chrome necesita permiso otra vez.');
 if(bkState==='error')return T('The last backup could not be written. Check that the file and folder still exist, then try again or choose the file again.','No se pudo guardar el último respaldo. Revise el archivo o elíjalo otra vez.');
 if(bkState==='ok')return T('Rewritten a few seconds after each change while the terminal is open.','Se actualiza segundos después de cada cambio con la terminal abierta.');

async function writeBackup(ask){if(!bh)return;if(bkBusy){bkAgain=true;return}bkBusy=true;
 try{let perm=await bh.queryPermission({mode:'readwrite'});if(perm!=='granted'&&ask)perm=await bh.requestPermission({mode:'readwrite'});
  if(perm!=='granted'){if(bkState!=='paused')bkSet('paused');return}
  let old=null;try{const t=await(await bh.getFile()).text();if(t.trim())old=unwrapBackup(JSON.parse(t))}catch(e){if(e&&e.name!=='SyntaxError')throw e}
  if(recCount(S)===0&&recCount(old)>0){if(bkState!=='guard')bkSet('guard');return}
  const stamp=today(),state={...S,lastBackup:stamp},w=await bh.createWritable();
  await w.write(JSON.stringify({app:BK_APP,saved:new Date().toISOString(),records:recCount(S),encrypted:false,state}));await w.close();

  if(bkState!=='ok')bkSet('ok');else bkUI()}
 catch(e){if(bkState!=='error')bkSet('error')}

const reportV3=V.report;V.report=()=>`<div class="grid">${bkCard()}</div><p></p>`+reportV3();
document.addEventListener('click',async e=>{if(e.target.id==='bkpill'){if(!bh)return pickBackup();if(bkState==='guard'){tab='report';return render()}return writeBackup(true)}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='bkpick')pickBackup();else if(a==='bknow')writeBackup(true);else if(a==='bkoff'){bh=null;clearTimeout(bkTimer);try{await idbOp('readwrite',s=>s.delete('bh'))}catch(_){}bkSet('none')}});

/* ===== phone <-> Mac sync: encrypted, combines changes record by record ===== */
const SY_CFG='mmv_cattle_sync',SY_DB='cattle_sync',SY_DESC='cattle-terminal-sync (encrypted)',SY_FILE='cattle-sync.json';
const SY_LOCAL=['lang','plan','rpt','lastBackup','syncTag']; /* each device keeps its own */
const stable=v=>Array.isArray(v)?'['+v.map(stable).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}':JSON.stringify(v===undefined?null:v);
const same=(a,b)=>a===undefined||b===undefined?a===b:stable(a)===stable(b);
const jcopy=v=>v===undefined?v:JSON.parse(JSON.stringify(v));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
const hasIds=a=>a.every(x=>isObj(x)&&typeof x.id==='string'&&x.id);
const SY_SETS=['weights','notes','photos']; /* lists without ids: each item is its own record */
const labelOf=o=>isObj(o)?(o.tag||o.name||o.t||o.title||o.n||o.en||o.note||o.id||''):'';
/* three-way merge. b = last copy both devices shared (undefined when unknown), l = this device, r = cloud.
   Without b nothing is ever treated as deleted. When both changed one value, the cloud value stays and the other is reported. */
function merge3(b,l,r,path,log){
 if(same(l,r))return jcopy(l);
 if(b!==undefined){if(same(l,b))return jcopy(r);if(same(r,b))return jcopy(l)}
 const key=path[path.length-1];
 if(key==='quote'||key==='review'){log.push({where:path.join(' › '),what:'both-changed',kept:short(r),other:short(l)});return jcopy(r)}
 if(Array.isArray(l)&&Array.isArray(r)){const ba=Array.isArray(b)?b:undefined;
  if(SY_SETS.includes(key)){const count=a=>{const m=new Map();for(const x of a||[]){const k=stable(x);const e=m.get(k)||{n:0,x};e.n++;m.set(k,e)}return m};
   const B=count(ba),L=count(l),R=count(r),out=[];for(const k of new Set([...R.keys(),...L.keys()])){const nb=(B.get(k)||{}).n||0,nl=(L.get(k)||{}).n||0,nr=(R.get(k)||{}).n||0;
    const n=!ba?Math.max(nl,nr):nl===nb?nr:nr===nb?nl:Math.max(nl,nr);for(let i=0;i<n;i++)out.push(jcopy((R.get(k)||L.get(k)).x))}
   if(key==='weights')out.sort((x,y)=>String(x.d).localeCompare(String(y.d)));return out}
  if(hasIds(l)&&hasIds(r)&&(!ba||hasIds(ba))){const map=a=>new Map((a||[]).map(x=>[x.id,x])),B=map(ba),L=map(l),R=map(r),out=[];
   for(const id of [...R.keys(),...[...L.keys()].filter(i=>!R.has(i))]){const x=L.get(id),y=R.get(id),o=B.get(id);
    if(x&&y)out.push(merge3(o,x,y,[...path,labelOf(y)||id],log));
    else{const one=x||y;if(o&&same(one,o))continue;if(o)log.push({where:path.join(' › '),what:'edited-vs-deleted',item:labelOf(one)});out.push(jcopy(one))}}
   return out}
  if(l.length===r.length)return r.map((y,i)=>merge3(ba&&ba.length===r.length?ba[i]:undefined,l[i],y,[...path,labelOf(y)||String(i+1)],log));
 }
 if(isObj(l)&&isObj(r)){const o={},bo=isObj(b)?b:undefined;
  for(const k of new Set([...Object.keys(r),...Object.keys(l)])){const x=l[k],y=r[k],z=bo?bo[k]:undefined;let v;
   if(x===undefined)v=z!==undefined&&same(y,z)?undefined:jcopy(y);else if(y===undefined)v=z!==undefined&&same(x,z)?undefined:jcopy(x);else v=merge3(z,x,y,[...path,k],log);
   if(v!==undefined)o[k]=v}
  return o}
 log.push({where:path.join(' › '),what:'both-changed',kept:short(r),other:short(l)});return jcopy(r)}
const short=v=>{const s=typeof v==='string'?v:JSON.stringify(v);return s==null?'':s.length>80?s.slice(0,80)+'…':s};
const shared=s=>{const o=jcopy(s);for(const k of SY_LOCAL)delete o[k];return o};
const withLocal=(m,s)=>{const o=jcopy(m);for(const k of SY_LOCAL)if(s[k]!==undefined)o[k]=s[k];return o};
/* a starter plan nobody edited should not be copied into the other device */
const planPrint=p=>{const q=jcopy(p);delete q.id;delete q.start;return stable(q)};
function joinPrep(local){const l=shared(local),d=shared(defaults()),starters=new Set(d.plans.map(planPrint));
 l.plans=l.plans.filter(p=>!starters.has(planPrint(p)));
 /* settings you never changed here simply take the cloud value */
 for(const k of Object.keys(l)){if(k==='plans')continue;if(same(l[k],d[k]))delete l[k];else if(isObj(l[k])&&isObj(d[k]))for(const j of Object.keys(l[k]))if(same(l[k][j],d[k][j]))delete l[k][j]}
 return l}
function mergeJoin(local,remote,log){const l=joinPrep(local),r=jcopy(remote),mine=new Set(r.plans.map(p=>p.id));
 for(const p of l.plans)if(!mine.has(p.id)&&r.plans.some(q=>q.name===p.name))p.name+=' (from this device)';
 /* a setting the cloud copy never changed must not overwrite one you did change here */
 const d=shared(defaults());for(const k of Object.keys(l)){if(k==='plans'||r[k]===undefined)continue;if(same(r[k],d[k]))r[k]=jcopy(l[k]);else if(isObj(l[k])&&isObj(r[k])&&isObj(d[k]))for(const j of Object.keys(l[k]))if(same(r[k][j],d[k][j]))r[k][j]=jcopy(l[k][j])}
 return merge3(undefined,l,r,[],log)}
/* how many records of the copy "from" are missing in "to" */
function lost(from,to){let n=0;for(const k of ['plans','herd','book','log','stock','tasks','quotes','research','risks','resources','ledger','offers','decisions']){const have=new Set((to[k]||[]).map(x=>x.id));n+=(from[k]||[]).filter(x=>!have.has(x.id)).length}
 const th=new Map((to.herd||[]).map(a=>[a.id,a]));for(const a of from.herd||[]){const t=th.get(a.id);if(t)for(const k of SY_SETS)n+=Math.max(0,(a[k]||[]).length-(t[k]||[]).length)}return n}
/* things two devices can create together that the app would normally block */
function mergeProblems(s){const out=[],act=activeBook(s.book),dup=(arr,f)=>{const m={};for(const x of arr){const k=f(x);m[k]=(m[k]||0)+1}return Object.keys(m).filter(k=>m[k]>1)};
 for(const t of dup(s.herd,a=>String(a.tag).trim().toLowerCase()))out.push(T('Two animals with tag ','Dos animales con arete ')+t);
 if(dup(act.filter(x=>!['pay','receive'].includes(x.type)),x=>[x.type,x.d,x.c,x.who,x.note,x.cat].join('|')).length)out.push(T('Possible duplicate money entries (same date, type and amount).','Posibles movimientos duplicados.'));
 if(dup(act.filter(x=>['sale','death','animal_purchase'].includes(x.type)),x=>x.animal+'|'+(x.type==='death'?'sale':x.type)).length)out.push(T('One animal has two purchases or two sales/losses in the book.','Un animal tiene dos compras o dos ventas/bajas.'));
 for(const o of act.filter(x=>x.method==='credit'))if(openAmt(o,act)<0)out.push(T('A debt or collection was paid twice.','Una deuda o cobro se pagó dos veces.'));
 const bad=cashOK(s.book);if(bad)out.push(T('Cash goes below zero on ','El efectivo queda negativo el ')+bad);return out}

/* ---------- storage, encryption, GitHub ---------- */
let syCfg={};try{syCfg=JSON.parse(localStorage.getItem(SY_CFG)||'{}')||{}}catch(e){}
const syKeep=()=>{try{localStorage.setItem(SY_CFG,JSON.stringify(syCfg))}catch(e){}};
function syDb(mode,fn){return new Promise((res,rej)=>{const q=indexedDB.open(SY_DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onerror=()=>rej(q.error);q.onsuccess=()=>{const tx=q.result.transaction('k',mode),x=fn(tx.objectStore('k'));tx.oncomplete=()=>{res(x&&x.result);q.result.close()};tx.onerror=tx.onabort=()=>{rej(tx.error);q.result.close()}}})}
const syGet=k=>syDb('readonly',s=>s.get(k)),syPut=(k,v)=>syDb('readwrite',s=>s.put(v,k));
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let syKeys={};
async function syKey(pass,salt){const id=pass+'|'+b64(salt);if(!syKeys[id])syKeys[id]=await aes(pass,salt);return syKeys[id]}
async function syLock(obj,pass,saltText){const salt=saltText?unb64(saltText):crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await syKey(pass,salt),enc8.encode(JSON.stringify(obj))));return JSON.stringify({app:'Cattle Sync',v:1,salt:b64(salt),iv:b64(iv),data:b64(ct)})}
async function syOpen(text,pass){let e;try{e=JSON.parse(text)}catch(_){throw new Error('BADFILE')}if(!e||e.app!=='Cattle Sync')throw new Error('BADFILE');
 let pt;try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.iv)},await syKey(pass,unb64(e.salt)),unb64(e.data))}catch(_){throw new Error('WRONGPASS')}
 const o=JSON.parse(new TextDecoder().decode(pt));if(!o||!o.state||!Array.isArray(o.state.plans)||!o.state.plans.length||!o.rev||!Array.isArray(o.lineage))throw new Error('BADFILE');o.salt=e.salt;return o}
async function gh(path,opt={}){const h={Authorization:'Bearer '+syCfg.token,Accept:'application/vnd.github+json'};if(opt.body)h['Content-Type']='application/json';
 let r;try{r=await fetch('https://api.github.com'+path,{method:opt.method||'GET',body:opt.body,headers:h,cache:'no-store'})}catch(e){throw new Error('OFFLINE')}
 if(r.status===401)throw new Error('BADTOKEN');if(r.status===403||r.status===429)throw new Error('LIMIT');if(r.status===404)throw new Error('NOTFOUND');if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function findCopy(){for(let p=1;p<=10;p++){const a=await gh('/gists?per_page=100&page='+p);const g=a.find(x=>x.description===SY_DESC);if(g)return g.id;if(a.length<100)break}return null}
async function readCopy(id){const g=await gh('/gists/'+id),f=g.files&&g.files[SY_FILE];if(!f)throw new Error('BADFILE');
 if(!f.truncated)return f.content;let r;try{r=await fetch(f.raw_url,{cache:'no-store'})}catch(e){throw new Error('OFFLINE')}if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}
async function envelope(state,lineage,salt){const rev=uid()+uid(),text=await syLock({rev,lineage:[...lineage,rev].slice(-200),saved:new Date().toISOString(),state},syCfg.pass,salt);
 if(text.length>9e6)throw new Error('TOOBIG');return{rev,text}}

/* ---------- one sync pass ---------- */
const sy={state:'off',err:'',busy:false,again:false,timer:null,last:syCfg.last||0};
const SY_ERR={BADTOKEN:['GitHub rejected the token. Make a new one with only the gist box ticked.','GitHub rechazó el token.'],WRONGPASS:['Wrong sync passphrase. It must match the other device exactly.','Frase incorrecta. Debe ser igual en ambos.'],LIMIT:['GitHub refused for now (rate limit, or the token lacks the gist box). It will retry.','GitHub no aceptó por ahora. Reintentará.'],OFFLINE:['Could not reach GitHub. Check the internet; VPN, ad blockers or content filters can block it. Changes stay on this device and it will retry.','No se pudo conectar con GitHub. Los cambios quedan aquí y se reintentará.'],NOTFOUND:['The cloud copy was not found. Nothing on this device was changed. Disconnect, then connect again.','No se encontró la copia en la nube.'],BADFILE:['The cloud copy could not be read. Nothing on this device was changed.','No se pudo leer la copia.'],TOOBIG:['Too large to sync. Remove some photos.','Demasiado grande. Quite fotos.'],NOSAVE:['This device could not save the combined records (storage full?). Nothing was replaced.','No se pudo guardar en este equipo.'],NOCOPY:['No cloud copy yet. Start on the Mac first.','Aún no hay copia. Empiece en la Mac.'],EXISTS:['A cloud copy already exists. Use “Join” instead.','Ya existe una copia. Use “Unirse”.']};
const syMsg=c=>SY_ERR[c]?T(...SY_ERR[c]):c;
const connected=()=>!!(syCfg.token&&syCfg.pass&&syCfg.id);
/* never redraw while something is half typed */
function typing(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!['button','checkbox','range','file'].includes(a.type))return true;
 return [...document.querySelectorAll('#main input:not([data-set]),#main textarea:not([readonly]):not([data-set])')].some(i=>!['button','checkbox','range','file','date','hidden'].includes(i.type)&&i.value!==i.defaultValue)}
const readStored=()=>{try{return localStorage.getItem(KEY)}catch(e){return null}};
async function syncPass(manual,allowRemove){
 const copyText=await readCopy(syCfg.id),remote=await syOpen(copyText,syCfg.pass),rstate=shared(upgrade(jcopy(remote.state)));
 const meta=await syGet('meta')||{tag:'',bases:[]};
 /* a shared base only counts if this device's records are still the ones it was made from */
 const trusted=S.syncTag&&S.syncTag===meta.tag;
 let base=trusted?[...meta.bases].reverse().find(x=>remote.lineage.includes(x.rev)):undefined;
 const before=stable(S),local=shared(S),log=[];
 let merged=base?merge3(shared(upgrade(jcopy(base.state))),local,rstate,[],log):mergeJoin(S,rstate,log);
 if(!merged.plans.length)merged.plans=jcopy(rstate.plans);
 merged=upgrade(merged);const keepS=S;S=withLocal(merged,keepS);if(!S.plans.some(p=>p.id===S.plan))S.plan=S.plans[0].id;syncStatus();const next=S;S=keepS;merged=shared(next);
 if(base&&!allowRemove){const n=Math.max(lost(local,merged),lost(rstate,merged));if(n>5){sy.pendingRemove=n;return'confirm'}}
 const localChanges=!same(merged,local);
 if(localChanges&&!manual&&typing())return'wait';
 let rev=remote.rev;
 if(!same(merged,rstate)){const again=await syOpen(await readCopy(syCfg.id),syCfg.pass);if(again.rev!==remote.rev)return'retry';
  const env=await envelope(merged,remote.lineage,remote.salt);rev=env.rev;await gh('/gists/'+syCfg.id,{method:'PATCH',body:JSON.stringify({files:{[SY_FILE]:{content:env.text}}})})}
 if(stable(S)!==before)return'retry'; /* you edited while it was talking to GitHub */
 if(localChanges&&!manual&&typing())return'wait'; /* you started typing meanwhile */
 const tag=trusted?meta.tag:uid()+uid();
 if(localChanges){const hist=await syGet('previous')||[];hist.push({at:new Date().toISOString(),state:jcopy(S)});await syPut('previous',hist.slice(-3));
  if(stable(S)!==before)return'retry';if(!manual&&typing())return'wait'}
 if(localChanges||S.syncTag!==tag){const old=S;S={...next,lang:old.lang,syncTag:tag};if(!rawSave()){S=old;throw new Error('NOSAVE')}}
 const bases=(trusted?meta.bases:[]).filter(x=>x.rev!==rev);bases.push({rev,state:merged});await syPut('meta',{tag,bases:bases.slice(-3)});
 if(localChanges){render();schedBk()}
 if(log.length){syCfg.notes=[...(syCfg.notes||[]),...log.map(x=>({...x,at:today()}))].slice(-20)}
 return'done'}
async function syncRun(manual,allowRemove){if(!connected())return;if(sy.busy){sy.again=true;return}sy.busy=true;sy.state=sy.state==='error'?'error':'busy';syUI();
 const work=async()=>{let res='retry';for(let i=0;i<3&&res==='retry';i++)res=await syncPass(manual,allowRemove);
  if(res==='done'){sy.state='ok';sy.err='';sy.last=syCfg.last=Date.now();syKeep()}else if(res==='confirm'){sy.state='confirm';sy.err=''}else{sy.state='wait';sy.err='';syLater(15000)}};
 try{if(navigator.locks)await navigator.locks.request('cattle-sync',work);else await work()}
 catch(e){sy.state='error';sy.err=(e&&e.message)||String(e)}
 finally{sy.busy=false;syUI();if(sy.again){sy.again=false;syLater(3000)}}}
function syLater(ms){clearTimeout(sy.timer);sy.timer=setTimeout(()=>syncRun(false),ms)}
async function connect(mode,token,pass){syCfg={token,pass};sy.err='';sy.state='busy';syUI();
 try{const id=await findCopy();
  if(mode==='create'){if(id)throw new Error('EXISTS');const tag=uid()+uid(),state=shared(S),env=await envelope(state,[],null);
   const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:SY_DESC,public:false,files:{[SY_FILE]:{content:env.text}}})});
   syCfg.id=g.id;await syPut('meta',{tag,bases:[{rev:env.rev,state}]});S.syncTag=tag;rawSave()}
  else{if(!id)throw new Error('NOCOPY');await syOpen(await readCopy(id),pass);syCfg.id=id;await syPut('meta',{tag:'',bases:[]});delete S.syncTag}
  syKeep();await syncRun(true)}
 catch(e){const code=(e&&e.message)||String(e);syCfg={};syKeep();sy.state='off';sy.err=code;syUI();alert(syMsg(code))}}

/* ---------- screen ---------- */
const SY_TEXT={off:['SYNC OFF','SINCR. APAGADA'],busy:['SYNCING…','SINCRONIZANDO…'],ok:['SYNCED','SINCRONIZADO'],wait:['SYNC WAITING · finish typing, then click','SINCR. EN ESPERA · clic'],error:['SYNC ERROR · click','ERROR DE SINCR. · clic'],confirm:['SYNC NEEDS YOU · click','SINCR. LE NECESITA · clic']};
const syLabel=()=>T(...SY_TEXT[sy.state])+(sy.state==='ok'&&sy.last?' '+new Date(sy.last).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'');
function syBody(){const problems=connected()?mergeProblems(S):[];
 if(!connected())return `<p class="sm mu">${T('Keeps your phone and Mac on the same records, through a locked (encrypted) copy in your GitHub account. Set up the Mac FIRST, then join from the phone. Use the same GitHub account and the same passphrase on both. The token and passphrase stay saved on each device. Do not share them with anyone: whoever has them can read and change your records, and the token reaches every gist in that GitHub account.','Mantiene teléfono y Mac con los mismos registros mediante una copia cifrada en su cuenta de GitHub. Configure PRIMERO la Mac. No comparta el token ni la frase.')}</p>
 <div class="row"><label class="sm">GitHub token (gist)<br><input id="sy-token" type="password" autocomplete="off"></label><label class="sm">${T('Sync passphrase (12+ characters)','Frase de sincronización (12+)')}<br><input id="sy-pass" type="password" autocomplete="off"></label></div>
 <div class="row"><button class="p" data-act="sycreate">${T('This is my Mac: start sync','Es mi Mac: empezar')}</button><button data-act="syjoin">${T('This is my phone: join','Es mi teléfono: unirse')}</button></div>
 ${sy.err?`<p class="dn sm">${esc(syMsg(sy.err))}</p>`:''}<p class="sm mu">${T('If you forget the passphrase, the cloud copy cannot be opened. Your records stay on your devices.','Si olvida la frase, la copia no se puede abrir.')}</p>`;
 return `<p><b>${syLabel()}</b></p>${sy.err?`<p class="dn sm">${esc(syMsg(sy.err))}</p>`:''}
 ${sy.state==='confirm'?`<p class="dn">${T(`This sync would remove ${sy.pendingRemove} records. Nothing has changed yet. Continue only if you deleted them on purpose.`,`Esto quitaría ${sy.pendingRemove} registros. Aún no cambió nada. Continúe solo si los borró a propósito.`)}</p><div class="row"><button data-act="syremove">${T('Yes, remove them','Sí, quitarlos')}</button><button data-act="sydrop">${T('No: disconnect and keep everything here','No: desconectar')}</button></div>`:''}
 ${problems.length?`<p class="dn"><b>${T('Check these:','Revise esto:')}</b><br>${problems.map(esc).join('<br>')}</p>`:''}
 ${(syCfg.notes||[]).length?`<details><summary class="sm">${T('Changed on both devices','Cambiado en ambos')} (${syCfg.notes.length})</summary>${syCfg.notes.slice().reverse().map(n=>`<p class="sm">${esc(n.at)} · ${esc(n.where||'')} · ${n.what==='both-changed'?T('kept','se guardó')+' “'+esc(n.kept)+'”, '+T('not','no')+' “'+esc(n.other)+'”':T('kept an edited item the other device deleted: ','se conservó: ')+esc(String(n.item))}</p>`).join('')}<button data-act="syclear">${T('Clear this list','Borrar lista')}</button></details>`:''}
 <p class="sm mu">${T('Syncs when the terminal is open: a few seconds after a change, when you come back to it, and about once a minute. A device that is closed or offline catches up the next time you open it. “Erase all” on a synced device does not erase the cloud: the records come back at the next sync.','Sincroniza con la terminal abierta. Un equipo cerrado o sin internet se pone al día al abrirla.')}</p>
 <div class="row"><button class="p" data-act="synow">${T('Sync now','Sincronizar')}</button><button data-act="syprev">${T('Download this device’s copy from before the last incoming change','Descargar copia anterior')}</button><button data-act="sydrop">${T('Disconnect this device','Desconectar')}</button></div>`}
const syCard=()=>card(T('Phone and Mac sync','Sincronizar teléfono y Mac'),`<div id="sybody">${syBody()}</div>`);
function syUI(){const p=$('#sypill');if(p){p.textContent=connected()?syLabel():T(...SY_TEXT.off);p.style.cssText='font-size:11px;font-weight:700;color:'+(sy.state==='ok'?'var(--up)':sy.state==='error'||sy.state==='confirm'?'var(--dn)':'var(--am)')}
 const b=$('#sybody');if(b&&!(document.activeElement&&b.contains(document.activeElement)&&document.activeElement.tagName==='INPUT')&&!(!connected()&&$('#sy-token')&&($('#sy-token').value||$('#sy-pass').value)))b.innerHTML=syBody()}
const reportV4=V.report;V.report=()=>`<div class="grid">${syCard()}</div><p></p>`+reportV4();
const savedV4=save;save=function(){const ok=savedV4();if(connected())syLater(4000);return ok};
document.addEventListener('click',async e=>{if(e.target.id==='sypill'){if(connected()&&sy.state!=='confirm')syncRun(true);tab='report';render();return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='sycreate'||a==='syjoin'){const t=val('sy-token').trim(),p=val('sy-pass');if(!t)return alert(T('Paste the GitHub token.','Pegue el token.'));if(p.length<12)return alert(T('Use a passphrase of 12 or more characters.','Use 12+ caracteres.'));
  $('#sy-token').value='';$('#sy-pass').value='';document.activeElement&&document.activeElement.blur();connect(a==='sycreate'?'create':'join',t,p)}
 else if(a==='synow')syncRun(true);
 else if(a==='syremove')syncRun(true,true);
 else if(a==='sydrop'){if(!confirm(T('Disconnect this device? Records here stay. The cloud copy and other devices are not changed.','¿Desconectar? Sus registros se quedan.')))return;syCfg={};syKeep();clearTimeout(sy.timer);sy.state='off';sy.err='';delete S.syncTag;rawSave();try{await syPut('meta',{tag:'',bases:[]})}catch(_){}render();syUI()}
 else if(a==='syclear'){syCfg.notes=[];syKeep();syUI()}
 else if(a==='syprev'){const h=await syGet('previous')||[];if(!h.length)return alert(T('There is no earlier copy yet.','Aún no hay copia anterior.'));const x=h[h.length-1].state;dl('cattle-before-sync-'+today()+'.json',JSON.stringify(x),'application/json')}});
document.addEventListener('click',e=>{if(e.target.id==='lang')setTimeout(syUI,0)});
document.addEventListener('visibilitychange',()=>{if(connected())syncRun(false)});
window.addEventListener('online',()=>{if(connected())syncRun(false)});
window.addEventListener('focus',()=>{if(connected())syLater(1000)});
/* two open windows on one computer: always work from what was saved last */
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){S=load();render()}else if(e.key===SY_CFG){try{syCfg=JSON.parse(e.newValue||'{}')||{}}catch(_){syCfg={}}syUI()}});
setInterval(()=>{if(connected()&&!document.hidden&&sy.state!=='confirm')syncRun(false)},60000);
/* ===== start ===== */
/* never redraw while a mouse button is down: leaving a field redraws the page, which would swallow the click that caused it */
let held=false,queued=false;const renderNow=render;
render=function(){if(held){queued=true;return}queued=false;renderNow()};
const release=()=>{if(!held)return;held=false;setTimeout(()=>{if(queued&&!held){queued=false;renderNow()}},0)};
document.addEventListener('mousedown',()=>{held=true},true);for(const ev of ['mouseup','dragend','contextmenu','blur'])window.addEventListener(ev,e=>{if(ev!=='blur'||e.target===window)release()},true);
S=load();render();bkUI();
(async()=>{if(!FSA)return;try{bh=await idbOp('readonly',s=>s.get('bh'))||null}catch(e){}if(!bh)return;bkState='paused';let p='prompt';try{p=await bh.queryPermission({mode:'readwrite'})}catch(e){}if(p==='granted'){bkState='ok';writeBackup(false)}bkUI()})();
syUI();if(connected()){sy.state='busy';syncRun(false)}
</script></body></html>
